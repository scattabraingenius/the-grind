<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0812">
<title>Audio Board</title>
<link rel="icon" type="image/png" sizes="32x32" href="./icons/audio-cassette-32.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/audio-cassette-180.png">
<meta name="application-name" content="Audio Board">
<noscript><meta http-equiv="refresh" content="0;url=./album/?scope=all&amp;view=sort"></noscript>
<style>body{background:#0C0812;color:#EDE7F6;font-family:system-ui,sans-serif;padding:24px}a{color:#C9A6FF}</style>
</head>
<body>
<p>Opening Audio Board… <a href="./album/?scope=all">Continue</a></p>
<script>
// Audio Board and the Album Planner are one page now. Old links (?take=, ?lyrics=) carry over.
var p = new URLSearchParams(location.search);
if (!p.has("scope")) p.set("scope", "all");
if (!p.has("view") && !p.has("take") && !p.has("lyrics")) p.set("view", "sort");
location.replace("./album/?" + p.toString() + location.hash);
</script>
</body>
</html>
