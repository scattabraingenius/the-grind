<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0812">
<title>Album Board</title>
<link rel="icon" href="../favicon-32.png">
<style>
  :root {
    color-scheme: dark;
    --paper:#0C0812; --card:#17111F; --surface-2:#221934; --input-bg:#120B1A; --track:#372950;
    --ink:#EDE7F6; --muted:#A599BF; --muted-2:#786A93; --line:#372950;
    --signal:#A855F7; --signal-dim:#C9A6FF; --star:#F2C14E; --alarm:#F0575C; --ok:#4ADE80;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:var(--sans); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4; }
  button, input, textarea, select { font:inherit; color:inherit; }
  .wrap { max-width:1160px; margin:0 auto; padding:16px 16px 80px; }
  .eyebrow { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-2); }
  header.top { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  header.top h1 { margin:2px 0 0; font-size:26px; letter-spacing:-.02em; }
  header.top a { color:var(--signal-dim); text-decoration:none; font-size:14px; }
  .tabs { display:flex; gap:6px; margin:6px 0 14px; }
  .tab { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer; font-weight:700; font-size:14px; }
  .tab[aria-selected="true"] { background:var(--signal); border-color:var(--signal); color:#fff; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .tools input[type=search] { flex:1 1 220px; min-width:0; background:var(--input-bg); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
  select { background:var(--input-bg); border:1px solid var(--line); border-radius:10px; padding:9px 10px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { background:transparent; border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:13px; color:var(--muted); cursor:pointer; }
  .chip[aria-pressed="true"] { border-color:var(--signal); color:var(--ink); background:var(--surface-2); }
  .grid { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.25fr); gap:14px; align-items:start; }
  @media (max-width:820px) { .grid { grid-template-columns:minmax(0,1fr); } .detail.empty { display:none; } }
  .list { display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; cursor:pointer; }
  .row:hover { border-color:var(--track); background:#1b1424; }
  .row.active { border-color:var(--signal); }
  .row .t { flex:1 1 auto; min-width:0; }
  .row .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .t small { color:var(--muted-2); font-family:var(--mono); font-size:11px; }
  .row { flex-wrap:wrap; }
  .row .version-scores { flex-basis:100%; display:flex; flex-wrap:wrap; gap:6px; }
  .version-score { display:flex; align-items:center; gap:7px; max-width:100%; min-height:36px; text-align:left; background:var(--input-bg); border:1px solid var(--line); border-radius:8px; padding:5px 7px; cursor:pointer; }
  .version-score span { font:10px/1.4 var(--mono); overflow-wrap:anywhere; min-width:0; }
  .version-score strong { font:700 13px var(--mono); color:var(--signal-dim); flex-shrink:0; }
  .version-score .version-status { display:block; font:10px var(--sans); margin-top:2px; color:var(--muted); }
  .version-score[aria-pressed=true] { border-color:var(--signal); }
  .scope-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0; }
  .scope-note { font-size:12px; color:var(--muted); margin:8px 0 12px; }
  dialog { color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; width:min(660px,calc(100% - 24px)); max-height:90vh; }
  dialog::backdrop { background:rgba(0,0,0,.75); }
  dialog h2 { margin:0 0 10px; }
  dialog input[type=text], dialog input[type=search] { display:block; width:100%; min-width:0; background:var(--input-bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0 12px; }
  .session-options { max-height:42vh; overflow:auto; margin:12px 0; }
  .session-song { border-bottom:1px solid var(--line); padding:8px 0; }
  .session-song b { font-size:13px; }
  .session-option { display:flex; gap:8px; align-items:center; padding:6px 0; font-size:12px; }
  .session-option input { flex-shrink:0; accent-color:var(--signal); }
  .session-option span { overflow-wrap:anywhere; }
  .score { font-family:var(--mono); font-weight:800; min-width:42px; text-align:center; border-radius:8px; padding:4px 6px; background:var(--surface-2); color:var(--muted); font-size:14px; }
  .score.hi { color:#0C0812; background:var(--star); } .score.mid { color:var(--ink); background:var(--track); }
  .best-score::before { content:"BEST"; display:block; font-size:8px; letter-spacing:.06em; opacity:.8; }
  .badge { font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--line); border-radius:6px; padding:2px 6px; color:var(--muted); white-space:nowrap; }
  .badge.short { border-color:var(--ok); color:var(--ok); } .badge.maybe { border-color:var(--star); color:var(--star); } .badge.cut { border-color:var(--alarm); color:var(--alarm); }
  .badge.ep { border-color:var(--signal-dim); color:var(--signal-dim); }
  .in-album { color:var(--signal-dim); font-size:16px; }
  .detail { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; box-shadow:var(--shadow); }
  @media (max-width:820px) { .detail { position:static; max-height:none; } }
  .detail.empty { color:var(--muted); text-align:center; padding:40px 16px; }
  .detail h2 { margin:2px 0 4px; font-size:22px; }
  .detail-back { display:none; margin-bottom:12px; }
  @media (max-width:820px) { .detail-back { display:inline-block; } }
  .meta { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .versions { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .scorebox { display:flex; align-items:center; gap:12px; margin:8px 0 12px; }
  .scorebox input[type=range] { flex:1; accent-color:var(--signal); }
  .scorebox input[type=number] { width:72px; background:var(--input-bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-family:var(--mono); font-weight:800; font-size:18px; text-align:center; }
  .status { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .btn { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; font-size:14px; font-weight:600; }
  .btn:hover { border-color:var(--signal); }
  .btn.primary { background:var(--signal); border-color:var(--signal); color:#fff; }
  .btn.small { padding:5px 9px; font-size:12px; }
  .btn[aria-pressed="true"].s-short { background:var(--ok); color:#0C0812; border-color:var(--ok); }
  .btn[aria-pressed="true"].s-maybe { background:var(--star); color:#0C0812; border-color:var(--star); }
  .btn[aria-pressed="true"].s-cut { background:var(--alarm); color:#fff; border-color:var(--alarm); }
  textarea { width:100%; min-height:64px; background:var(--input-bg); border:1px solid var(--line); border-radius:10px; padding:9px 11px; resize:vertical; }
  .prompt-field { margin:16px 0; min-width:0; }
  .field-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .field-head h3, .field-head label { margin:0; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .field-tools { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .field-count { font-family:var(--mono); font-size:10px; color:var(--muted); }
  .field-copy.copied { border-color:var(--ok); color:var(--ok); }
  .btn:disabled { opacity:.5; cursor:default; }
  :is(button,input,textarea,select,.row):focus-visible { outline:2px solid var(--signal-dim); outline-offset:3px; }
  .field-text { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--input-bg); border:1px solid var(--line); border-radius:10px; padding:12px; margin:0; font:14px/1.55 var(--mono); }
  .prompt-field textarea { font:14px/1.55 var(--mono); }
  .prompt-field input { width:100%; }
  .prompt-field .field-empty { color:var(--muted); font-family:var(--sans); }
  .save-status { flex-basis:100%; color:var(--muted); }
  .save-status.failed { color:var(--alarm); }
  .account-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; color:var(--muted); font-size:12px; }
  .account-bar #syncStatus { flex:1 1 240px; }
  #syncStatus.failed { color:var(--alarm); }
  #accountWho { overflow-wrap:anywhere; }
  details.style { margin:6px 0 12px; } details.style summary { cursor:pointer; color:var(--muted); font-size:13px; }
  details.style p { font-size:13px; color:var(--muted); margin:6px 0; }
  pre.lyrics { white-space:pre-wrap; word-wrap:break-word; font-family:var(--sans); font-size:14.5px; line-height:1.55; background:var(--input-bg); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0; }
  pre.lyrics .tag { color:var(--signal-dim); font-family:var(--mono); font-size:12px; }
  .track { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:6px; }
  .track .n { font-family:var(--mono); font-weight:800; color:var(--signal-dim); width:28px; text-align:right; }
  .track .t { flex:1; min-width:0; } .track .t b { display:block; }
  .track .t small { color:var(--muted-2); font-size:12px; }
  .track .ctl { display:flex; gap:4px; }
  .empty-note { color:var(--muted); padding:20px 4px; }
  .foot { margin-top:26px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; color:var(--muted-2); font-size:12px; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--signal); border-radius:999px; padding:8px 16px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.on { opacity:1; }
  .editor { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .editor label { display:flex; flex-direction:column; gap:4px; font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-2); }
  .editor input, .editor textarea { background:var(--input-bg); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-family:var(--sans); font-size:14.5px; letter-spacing:0; text-transform:none; color:var(--ink); }
  .editor textarea.ly { min-height:340px; line-height:1.55; }
  .versions .btn small { font-family:var(--mono); opacity:.8; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">The Grind · Album</div>
      <h1>Album Board</h1>
      <div class="meta" id="summary"></div>
    </div>
    <a href="../">← The Grind</a>
  </header>

  <div class="account-bar">
    <span id="syncStatus" role="status" aria-live="polite">Checking sign-in… Your scores are saved on this device.</span>
    <span id="accountWho"></span>
    <button class="btn small" id="signInBtn" hidden>Sign in with Google</button>
    <button class="btn small" id="signOutBtn" hidden>Sign out</button>
    <button class="btn small" id="retrySyncBtn" hidden>Retry sync</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabSongs" aria-selected="true">Songs</button>
    <button class="tab" role="tab" id="tabAlbum" aria-selected="false">Tracklist <span id="albumCount"></span></button>
  </div>

  <section id="viewSongs">
    <div class="tools">
      <input type="search" id="q" aria-label="Search songs and prompts" placeholder="Search titles, lyrics and prompts" autocomplete="off">
      <select id="sort" aria-label="Sort">
        <option value="session">Sort: session</option>
        <option value="score">Sort: best score</option>
        <option value="title">Sort: title</option>
      </select>
    </div>
    <div class="scope-tools"><span class="eyebrow">Working session</span><button class="btn small" id="newSession">+ New session</button><button class="btn small hidden" id="manageSession">Manage session</button></div>
    <div class="chips" id="sessionChips" aria-label="Working sessions"></div>
    <div class="chips" id="chips" aria-label="Filter within this session"></div>
    <div class="scope-note" id="scopeNote" role="status"></div>
    <div class="grid">
      <div class="list" id="list"></div>
      <div class="detail empty" id="detail">Pick a song to read it, score it, and copy its Suno fields.</div>
    </div>
  </section>

  <section id="viewAlbum" class="hidden">
    <div class="tools">
      <button class="btn" id="copyTracklist">Copy tracklist</button>
      <button class="btn" id="clearAlbum">Clear tracklist</button>
    </div>
    <div id="tracks"></div>
  </section>

  <div class="foot">
    <span id="built"></span>
    <span class="save-status" id="saveStatus" role="status">Saved on this device. Export scores keeps a separate backup.</span>
    <button class="btn small" id="exportBtn">Export scores</button>
    <button class="btn small" id="importBtn">Import scores</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="sessionDialog" aria-labelledby="sessionDialogTitle">
  <form id="sessionForm">
    <h2 id="sessionDialogTitle">New custom session</h2>
    <label for="sessionName">Session name</label><input type="text" id="sessionName" maxlength="100" required placeholder="Album finalists">
    <div class="scope-tools"><button class="btn small" type="button" id="seedCurrent">Use current session</button><button class="btn small" type="button" id="seedTracklist">Use tracklist</button><span id="sessionCount"></span></div>
    <input type="search" id="sessionSearch" aria-label="Find versions to include" placeholder="Find a song or version">
    <div class="session-options" id="sessionVersionOptions"></div>
    <div class="scope-tools"><button class="btn primary" type="submit">Save session</button><button class="btn" type="button" id="sessionCancel">Cancel</button><button class="btn hidden" type="button" id="deleteSession">Delete session</button></div>
  </form>
</dialog>

<script src="songs.js"></script>
<script src="sync.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
"use strict";
// Keep the existing local key. Account sync merges private records in a child of The Grind's node.
const KEY = "grind.album.v1";
const SONGS = (window.ALBUM_SONGS || []);
const BY = Object.fromEntries(SONGS.map(s => [s.slug, s]));
const STATUSES = [["short","Shortlist"],["maybe","Maybe"],["cut","Cut"]];
const SESSIONS = window.ALBUM_SESSIONS || [...new Set(SONGS.flatMap(s => s.versions.map(v => v.session)))].map(label => ({label}));
const FILTERS = [["all","Any rating"],["unrated","Unrated"],["short","Shortlist"],["maybe","Maybe"],["cut","Cut"],["album","On album"],["ep","EP"],["mine","My versions"]];

// v2: ratings are keyed by version stem (one score, status and note per version). Version 1 data was keyed
// by song slug, so it moves onto whichever version of that song was showing.
function migrate(st) {
  st = { ratings:{}, tracklist:[], pick:{}, custom:{}, collections:{}, ...st };
  if (st.v !== 2) {
    for (const slug of Object.keys(st.ratings)) {
      const s = BY[slug]; if (!s) continue;
      const stem = st.pick[slug] || s.versions[s.versions.length - 1].stem;
      st.ratings[stem] = { ...st.ratings[slug], ...(st.ratings[stem] || {}) };
      delete st.ratings[slug];
    }
    st.v = 2;
  }
  return st;
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") return migrate(s); } catch (e) {}
  return migrate({});
}
let state = AlbumSync.prepare(load());
let previousState = JSON.parse(JSON.stringify(state)), cloud = null, pendingRemoteDetail = false;
const deviceKey = KEY + ".device";
let deviceId;
try { deviceId = localStorage.getItem(deviceKey); } catch (err) {}
if (!deviceId) { deviceId = crypto.randomUUID(); try { localStorage.setItem(deviceKey, deviceId); } catch (err) {} }
function persist() {
  const status = $("saveStatus");
  try {
    if (state._sync.owner) localStorage.setItem(KEY + ".account." + state._sync.owner, JSON.stringify(state));
    localStorage.setItem(KEY, JSON.stringify(state));
    status.classList.remove("failed");
    status.textContent = "Saved on this device. Export scores keeps a separate backup.";
    return true;
  } catch (e) {
    status.classList.add("failed");
    status.textContent = "Changes could not be saved. Export a backup before closing this page.";
    toast("Changes aren't saved. Export a backup before closing.");
    return false;
  }
}
function save() {
  state = AlbumSync.capture(previousState, state, deviceId);
  previousState = JSON.parse(JSON.stringify(state));
  const saved = persist();
  if (cloud) cloud.changed();
  return saved;
}
let viewPrefs = {};
try { viewPrefs = JSON.parse(localStorage.getItem(KEY + ".view")) || {}; } catch (err) {}
let ui = { view:"songs", scope:viewPrefs.scope || "all", filter:FILTERS.some(([key]) => key === viewPrefs.filter) ? viewPrefs.filter : "all", q:"", sort:["session","score","title"].includes(viewPrefs.sort) ? viewPrefs.sort : "session", open:null };
function saveView() { try { localStorage.setItem(KEY + ".view", JSON.stringify({scope:ui.scope,filter:ui.filter,sort:ui.sort})); } catch (err) {} }

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function rating(stem) { return state.ratings[stem] || {}; }
function setRating(stem, patch) { state.ratings[stem] = { ...rating(stem), ...patch, at: Date.now() }; save(); }
function versionsOf(s) { return s.versions.concat(state.custom[s.slug] || []); }
function scopedVersions(s) {
  const versions = versionsOf(s);
  if (ui.scope.startsWith("session:")) return versions.filter(v => v.session === ui.scope.slice(8));
  if (ui.scope.startsWith("collection:")) { const members = new Set(state.collections[ui.scope.slice(11)]?.members || []); return versions.filter(v => members.has(v.stem)); }
  return versions;
}
function version(s) {
  const matching = scopedVersions(s), picked = matching.find(v => v.stem === state.pick[s.slug]);
  return picked || matching[matching.length - 1] || s.versions[s.versions.length - 1];
}
function best(s, versions = scopedVersions(s)) { const n = versions.map(v => rating(v.stem).score).filter(x => x != null); return n.length ? Math.max(...n) : null; }
function verLabel(v) { return v.custom ? (v.label || "My copy") : `v${String(v.version).padStart(2,"0")} ${v.writer} · ${v.session}`; }
function inAlbum(slug) { return state.tracklist.includes(slug); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1400); }
function scoreClass(n) { return n == null ? "" : n >= 80 ? "hi" : n >= 50 ? "mid" : ""; }

function matches(s) {
  const versions = scopedVersions(s); if (!versions.length) return false;
  const rs = versions.map(v => rating(v.stem)), f = ui.filter;
  if (f === "unrated" && rs.some(r => r.score != null)) return false;
  if (["short","maybe","cut"].includes(f) && !rs.some(r => r.status === f)) return false;
  if (f === "mine" && !versions.some(v => v.custom)) return false;
  if (f === "album" && !inAlbum(s.slug)) return false;
  if (f === "ep" && !s.ep) return false;
  if (ui.q) {
    const q = ui.q.toLowerCase();
    if (!s.title.toLowerCase().includes(q) && !versions.some(v =>
      [v.title,v.lyrics,...fieldsOf(v).map(f => f[2])].some(text => String(text || "").toLowerCase().includes(q)))) return false;
  }
  return true;
}
function sorted(arr) {
  const a = arr.slice();
  if (ui.sort === "title") a.sort((x,y) => x.title.localeCompare(y.title));
  else if (ui.sort === "score") a.sort((x,y) => (best(y) ?? -1) - (best(x) ?? -1) || x.title.localeCompare(y.title));
  return a;
}

function renderSummary() {
  const rated = SONGS.filter(s => best(s, versionsOf(s)) != null).length;
  $("summary").textContent = `${SONGS.length} songs · ${rated} scored · ${state.tracklist.length} on the album`;
  $("albumCount").textContent = state.tracklist.length ? `(${state.tracklist.length})` : "";
  $("built").textContent = window.ALBUM_BUILT ? `Songs loaded ${window.ALBUM_BUILT}` : "No songs.js found";
}
function renderChips() {
  $("chips").innerHTML = FILTERS.map(([k,l]) => `<button class="chip" data-f="${esc(k)}" aria-pressed="${ui.filter===k}">${esc(l)}</button>`).join("");
  const scopes = [["all","All"],...SESSIONS.map(s => ["session:"+s.label,s.label]),...Object.entries(state.collections).map(([id,s]) => ["collection:"+id,s.name])];
  $("sessionChips").innerHTML = scopes.map(([key,name]) => `<button class="chip" data-scope="${esc(key)}" aria-pressed="${ui.scope===key}">${esc(name)}</button>`).join("");
  $("manageSession").classList.toggle("hidden", !ui.scope.startsWith("collection:") || !state.collections[ui.scope.slice(11)]);
}
function renderList() {

  e.preventDefault(); const name = $("sessionName").value.trim();
  if (!name) { $("sessionName").setCustomValidity("Give the session a name."); $("sessionName").reportValidity(); return; }
  const existing = state.collections[sessionDraft.id];
  if (sessionDraft.editing && !existing) { toast("This session was deleted on another device. Create a new session."); $("sessionDialog").close(); return; }
  const members = new Set(existing?.members || []);
  if (!sessionDraft.editing) sessionDraft.members.forEach(stem => members.add(stem));
  else {
    // Apply only the changes made in this dialog, preserving concurrent additions on another device.
    for (const stem of sessionDraft.base) if (!sessionDraft.members.has(stem)) members.delete(stem);
    for (const stem of sessionDraft.members) if (!sessionDraft.base.has(stem)) members.add(stem);
  }
  state.collections[sessionDraft.id] = {name:name === sessionDraft.name && existing ? existing.name : name, created:existing?.created || Date.now(), members:[...members].sort()};
  save(); $("sessionDialog").close(); ui.filter = "all"; ui.q = ""; $("q").value = ""; chooseScope("collection:" + sessionDraft.id); toast("Session saved");
};
$("sessionName").oninput = () => $("sessionName").setCustomValidity("");
$("deleteSession").onclick = () => {
  const session = state.collections[sessionDraft.id]; if (!session) return;
  if (!confirm(`Delete the custom session "${session.name}"? Songs, versions, scores and notes are kept.`)) return;
  delete state.collections[sessionDraft.id]; save(); $("sessionDialog").close(); chooseScope("all"); toast("Session deleted. Songs and scores are kept.");
};

  }
  try {
    const config = {

      authDomain:"family-planner-ccafc.firebaseapp.com",
      databaseURL:"https://family-planner-ccafc-default-rtdb.firebaseio.com",
      projectId:"family-planner-ccafc"
    };
    if (!firebase.apps.length) firebase.initializeApp(config);
    cloud = AlbumSync.create({firebase, config, read:() => state, replace:replaceSyncedState, selectAccount:selectSyncAccount, status:syncStatus,
      account:(user, busy) => {
        $("accountWho").textContent = user ? (user.email || user.displayName || "Google account") : "";
        $("signInBtn").hidden = !!user; $("signInBtn").disabled = busy; $("signInBtn").textContent = busy ? "Signing in…" : "Sign in with Google";
        $("signOutBtn").hidden = !user;

}
