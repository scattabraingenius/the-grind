<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grind</title>
<style>
  /* ============================================================
     THE GRIND — personal command center   (v0.2.1-beta)
     Forked from Family Planner but fully data-isolated: its own Firebase
     path (planners/the-grind-scattabrain-2026) and its own grind.* localStorage keys.
     One day list (multi-profile tags), Places to Go + Shopping + Bills + Quick Notes.
     A soft completion chime (Web Audio, no external file) plays when an item
     is checked off; toggle it off via Sound: On/Off (device-local setting).
     "Delete completed (N)" clears all done tasks across every profile in one shot.
     Optional live cloud sync across devices (Firebase — see config block).
     Self-contained, offline, saves to localStorage.
     Edit SEED_PEOPLE / palette to taste.
     ============================================================ */
  :root {
    color-scheme: dark;
    --paper:#0C0812; --card:#17111F; --surface-2:#221934; --input-bg:#120B1A; --done-bg:#120D18; --track:#372950;
    --ink:#EDE7F6; --muted:#A599BF; --muted-2:#786A93; --line:#372950;
    --signal:#A855F7; --signal-dim:#C9A6FF;
    --star:#F2C14E; --alarm:#F0575C;
    --radius:12px;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media print {
    :root { color-scheme:light; --paper:#fff; --card:#fff; --surface-2:#fff; --input-bg:#fff; --done-bg:#fff; --track:#e2e2e2;
      --ink:#111; --muted:#444; --muted-2:#777; --line:#c4c4c4; --signal:#8A2BE2; --shadow:none; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body { background:#fff; }
    .wrap { padding:0; max-width:none; }
    .toolbar, .rowactions, .clock, .nextup, .util, .peoplebar .pb-edit, .row.parked, .add-inline, .shop-clear, .people-editor { display:none !important; }
    .panels { grid-template-columns:1fr 1fr; gap:16px; }
    .row, .shop-row, .place-row, .bill-row, .note-row, .date-card { break-inside:avoid; box-shadow:none !important; }
    header.top { margin-bottom:8px; }
    .dates-head-actions, .dc-actions, .dates-more, .dates-empty .btn, .date-editor, .place-edit, .place-del, .bill-edit, .bill-del, .shop-del, .note-pin, .note-del, .inline-input, .inline-textarea, .popover, .dates-past-toggle { display:none !important; }
    .dates-past-list:not(.expanded) { display:none !important; }
    .editable { padding:0; margin:0; }
    .editable:hover, .editable:focus-visible { background:none; outline:none; }
  }
  * { box-sizing:border-box; } html,body{ margin:0; }
  body { font-family:var(--sans); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4; }
  .wrap { max-width:1160px; margin:0 auto; padding:20px 20px 80px; }
  .hidden { display:none !important; }
  .eyebrow { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-2); }

  /* header */
  header.top { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand h1 { font-size:26px; margin:0; letter-spacing:-.02em; font-weight:800; }
  .brand .datestr { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .head-right { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .clock { font-family:var(--mono); font-size:20px; font-weight:600; }
  .clock .sec { color:var(--signal); }
  .progress-wrap { min-width:180px; }
  .progress-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:12px; }
  .progress-count { font-family:var(--mono); font-size:13px; font-weight:600; }
  .bar { height:8px; background:var(--track); border-radius:99px; overflow:hidden; width:180px; }
  .bar > span { display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--signal),#23B877); border-radius:99px; transition:width .35s ease; }
  .util { display:flex; gap:8px; align-items:center; }
  .sync-badge { font-family:var(--mono); font-size:11px; font-weight:600; margin-right:2px; white-space:nowrap; }

  .btn { font-family:var(--sans); font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 12px; border-radius:10px; cursor:pointer; box-shadow:var(--shadow); white-space:nowrap; }
  .btn:hover { border-color:var(--muted-2); }
  .btn.add { background:var(--signal); border-color:var(--signal); color:#1A0930; }
  .btn.sm { padding:5px 9px; font-size:12px; }

  /* next up */
  .nextup { background:radial-gradient(120% 140% at 0% 0%, #2E1E45 0%, #140B20 60%); border:1px solid #3D2A5C; box-shadow:0 0 0 1px rgba(168,85,247,.14), 0 12px 34px rgba(0,0,0,.45); border-radius:16px; padding:16px 18px; display:flex; align-items:center; gap:16px; margin-bottom:16px; color:#F1E9FB; }
  .nextup .lead { flex:1; min-width:0; }
  .nextup .eyebrow { color:#8A76A8; }
  .nextup .title { font-size:19px; font-weight:700; margin:3px 0; }
  .nextup .meta { font-family:var(--mono); font-size:12.5px; color:#C3B3DE; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .nextup .readout { text-align:right; font-family:var(--mono); flex:none; }
  .nextup .readout .count { font-size:24px; font-weight:700; color:var(--signal-dim); }
  .nextup .readout .subl { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#8A76A8; }
  .nextup.empty { color:#9C8CB8; justify-content:flex-start; }

  /* people bar */
  .peoplebar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .pfilter { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; padding:6px 12px 6px 8px; border-radius:99px; background:var(--card); border:1px solid var(--line); cursor:pointer; color:var(--ink); }
  .pfilter .dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .pfilter.active { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
  .pfilter.all { padding-left:12px; }
  .pb-edit { margin-left:auto; }

  .people-editor { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px; box-shadow:var(--shadow); }
  .pe-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .pe-row .swatch { width:24px; height:24px; border-radius:50%; border:2px solid var(--line); cursor:pointer; flex:none; }
  .pe-row input { flex:1; font-size:14px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--ink); outline:none; }
  .pe-row input:focus { border-color:var(--signal); }
  .pe-row .rm { color:var(--muted-2); background:none; border:1px solid var(--line); border-radius:8px; width:30px; height:30px; cursor:pointer; }
  .pe-row .rm:hover { color:var(--alarm); border-color:var(--alarm); }

  /* editable-field affordance (shared by inline editing everywhere) */
  .editable { cursor:pointer; border-radius:6px; padding:1px 4px; margin:-1px -4px; transition:background .1s ease; }
  .editable:hover { background:rgba(255,255,255,.06); }
  .editable:focus-visible { outline:2px solid var(--signal); outline-offset:1px; background:rgba(255,255,255,.06); }
  @media (hover:none) { .editable:hover { background:none; } }
  .inline-input, .inline-textarea { font-family:inherit; font-size:inherit; font-weight:inherit; color:var(--ink); background:var(--input-bg); border:1px solid var(--signal); border-radius:6px; padding:2px 6px; outline:none; width:100%; box-shadow:0 0 0 3px rgba(168,85,247,.14); }
  .inline-textarea { resize:vertical; min-height:44px; font-size:13px; }

  /* shared popover (people / category / date-time / priority) */
  .popover { position:fixed; z-index:1000; min-width:200px; max-width:min(300px,92vw); max-height:80vh; overflow-y:auto; background:var(--card); border:1px solid var(--signal); border-radius:10px; padding:10px; box-shadow:0 0 0 3px rgba(168,85,247,.12), var(--shadow); }
  .popover .pop-title { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .popover .pop-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .popover .pop-row:last-child { margin-bottom:0; }
  .popover label { font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:3px; }
  .popover input[type=time], .popover input[type=date], .popover select { font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:var(--input-bg); color:var(--ink); outline:none; width:100%; }
  .popover .pop-actions { display:flex; gap:6px; justify-content:flex-end; margin-top:8px; }
  .popover .pop-clear { font-size:11px; color:var(--muted); background:none; border:1px solid var(--line); border-radius:7px; padding:4px 8px; cursor:pointer; }
  .popover .pop-clear:hover { color:var(--ink); border-color:var(--muted-2); }
  .prislider-pop { display:flex; align-items:center; gap:10px; min-width:180px; }
  .prislider-pop input[type=range] { flex:1; accent-color:var(--signal); }

  /* important dates */
  .dates-section { margin-bottom:14px; }
  .dates-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .dates-head-actions { display:flex; gap:8px; }
  .dates-quick { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:10px; }
  .date-card { --cat:#66788B; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--cat); border-radius:var(--radius); padding:10px 12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:4px; min-width:0; }
  .date-card.ongoing { box-shadow:0 0 0 2px var(--signal), var(--shadow); }
  .dc-top { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .dc-count { font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--signal-dim); white-space:nowrap; }
  .dc-count.ongoing { color:#23B877; }
  .dc-count.today { color:var(--star); }
  .dc-cat { font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--cat); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dc-title { font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dc-when { font-family:var(--mono); font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dc-sub { font-size:11px; color:var(--muted-2); display:flex; flex-wrap:wrap; gap:5px; align-items:center; overflow:hidden; }
  .dc-sub .ptxt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px; }
  .dc-people { display:flex; flex-wrap:wrap; gap:3px; }
  .dc-people .pchip { font-size:10px; padding:2px 7px 2px 3px; }
  .dc-people .pchip .dot { width:11px; height:11px; }
  .dc-actions { display:flex; gap:4px; justify-content:flex-end; margin-top:2px; }
  .dates-more { display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--muted); background:var(--surface-2); border:1px dashed var(--line); border-radius:var(--radius); cursor:pointer; min-height:60px; }
  .dates-more:hover { color:var(--ink); border-color:var(--muted-2); }
  .dates-empty { grid-column:1/-1; display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:13px; padding:10px 2px; }
  .dates-all { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-top:10px; box-shadow:var(--shadow); }
  .dates-all-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .dates-all-list { display:flex; flex-direction:column; gap:8px; }
  .dates-past-toggle { font-size:12px; color:var(--muted); background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; margin-top:12px; }
  .dates-past-toggle:hover { color:var(--ink); border-color:var(--muted-2); }
  .dates-past-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; opacity:.85; }
  /* .date-editor is placed both inside .dates-quick's card grid and inside .dates-all-list's flex
     column — grid-column:1/-1 spans every track when it's a grid item; width:100% + min-width:0 make
     it fill (and never overflow) either container, instead of being squeezed into one card column. */
  .date-editor { grid-column:1/-1; width:100%; min-width:0; box-sizing:border-box; border:1px solid var(--signal); border-radius:var(--radius); padding:14px; background:var(--input-bg); box-shadow:0 0 0 3px rgba(168,85,247,.12), var(--shadow); }
  .date-editor .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px 14px; min-width:0; }
  .date-editor .field { min-width:0; }
  .date-editor .field.full { grid-column:1/-1; }
  .date-editor .field label { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:4px; }
  .date-editor input[type=text], .date-editor input[type=date], .date-editor input[type=time], .date-editor select, .date-editor textarea { font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); outline:none; width:100%; box-sizing:border-box; }
  .date-editor textarea { resize:vertical; min-height:44px; }
  .date-editor .who-picker { min-width:0; }
  .date-editor .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; justify-content:flex-end; }
  @media (max-width:760px){ .date-editor .grid { grid-template-columns:1fr; } }

  /* panels */
  .panels { display:grid; grid-template-columns:1fr 330px; gap:18px; align-items:start; }
  @media (max-width:820px){ .panels { grid-template-columns:1fr; } }
  .panel-title { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2); margin:0 2px 10px; display:flex; justify-content:space-between; align-items:center; }

  /* day toolbar */
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .quickadd { flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:4px 4px 4px 14px; box-shadow:var(--shadow); }
  .quickadd input { flex:1; border:none; outline:none; font-size:15px; background:transparent; padding:8px 0; color:var(--ink); }
  .quickadd .plus { font-family:var(--mono); color:var(--signal-dim); font-size:18px; font-weight:700; }
  select.ctrl, input.search { font-family:var(--sans); font-size:13px; color:var(--ink); border:1px solid var(--line); background:var(--card); border-radius:10px; padding:8px 10px; box-shadow:var(--shadow); cursor:pointer; }
  input.search { min-width:120px; cursor:text; }
  label.toggle { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; }

  /* day list */
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { display:grid; grid-template-columns:24px 52px minmax(66px,138px) minmax(0,1fr) 76px 122px 66px; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:var(--radius); padding:11px 14px; box-shadow:var(--shadow); }
  .row.overdue { border-left-color:var(--alarm); }
  .row.isnext { box-shadow:0 0 0 2px var(--signal), var(--shadow); }
  .row.done { opacity:.5; background:var(--done-bg); }
  .row.done .task-title { text-decoration:line-through; color:var(--muted); }
  .row.parked { opacity:.62; background:var(--done-bg); border-left-color:#9B87F5; }

  .cbx { appearance:none; -webkit-appearance:none; width:20px; height:20px; border:2px solid var(--muted-2); border-radius:6px; cursor:pointer; position:relative; flex:none; background:var(--card); }
  .cbx:checked { background:#23B877; border-color:#23B877; }
  .cbx:checked::after { content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(42deg); }
  .cbx:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }

  .pri { font-family:var(--mono); font-weight:700; font-size:15px; color:#fff; border-radius:8px; height:34px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
  .pri .fill { height:3px; width:80%; background:rgba(255,255,255,.5); border-radius:2px; margin-top:2px; }
  .pri .fill > i { display:block; height:100%; background:#fff; border-radius:2px; }
  .prislider { display:flex; align-items:center; gap:12px; }
  .prislider input[type=range] { flex:1; accent-color:var(--sliderc,var(--signal)); }
  .prival { font-family:var(--mono); font-weight:700; font-size:18px; color:#fff; width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .nextup .gauge { width:52px; height:52px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:22px; color:#fff; }

  .pchip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px 4px 4px; border-radius:99px; white-space:nowrap; color:var(--paper); }
  .pchip .dot { width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,.18); flex:none; }
  .pchip.none { background:var(--surface-2); color:var(--muted-2); border:1px dashed var(--line); }

  .task-title { font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task-title .star { color:var(--star); margin-right:4px; }
  .task-meta { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task-meta .due { font-weight:600; color:var(--muted); }
  .task-meta .due.over { color:var(--alarm); } .task-meta .due.today { color:var(--star); } .task-meta .due.soon { color:var(--signal-dim); }
  .task-meta .re { color:#9B87F5; }
  .cell-time { font-family:var(--mono); font-size:13px; text-align:center; }
  .cell-time .cd { display:block; font-size:10.5px; margin-top:1px; color:var(--signal-dim); }
  .cell-time .t.none { color:var(--muted-2); }

  .status-sel { font-family:var(--sans); font-size:12px; font-weight:600; border:none; border-radius:99px; padding:6px 8px; color:#fff; cursor:pointer; width:100%; text-align:center; -webkit-appearance:none; appearance:none; }
  .rowactions { display:flex; gap:4px; justify-content:flex-end; }
  .iconbtn { border:1px solid var(--line); background:var(--card); border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .iconbtn:hover { color:var(--ink); border-color:var(--muted-2); }
  .iconbtn.del:hover { color:var(--alarm); border-color:var(--alarm); }
  .later-head { font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9B87F5; margin:6px 2px 2px; }

  /* editor */
  .editor { background:var(--card); border:1px solid var(--signal); border-radius:var(--radius); padding:16px; box-shadow:0 0 0 3px rgba(168,85,247,.12), var(--shadow); }
  .editor .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px 16px; }
  .field { display:flex; flex-direction:column; gap:4px; } .field.full { grid-column:1/-1; }
  .field label { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .field input[type=text], .field input[type=time], .field input[type=date], .field input[type=datetime-local], .field textarea, .field select { font-family:var(--sans); font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--ink); outline:none; width:100%; }
  .field textarea { resize:vertical; min-height:44px; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--signal); box-shadow:0 0 0 3px rgba(168,85,247,.14); }
  .starbox { display:inline-flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; user-select:none; padding:8px 0; }
  .reappear-inline { display:flex; gap:8px; align-items:center; } .reappear-inline input { flex:1; }
  .editor .actions { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }

  /* multi-person picker */
  .who-picker { display:flex; flex-wrap:wrap; gap:6px; }
  .who-opt { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 10px 5px 7px; border-radius:99px; background:var(--input-bg); border:1px solid var(--line); color:var(--muted); cursor:pointer; }
  .who-opt .dot { width:12px; height:12px; border-radius:50%; opacity:.45; }
  .who-opt.on { color:var(--ink); border-color:var(--ink); }
  .who-opt.on .dot { opacity:1; }

  /* multi-person chips in a row (compact, wrap) */
  .r-who { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .r-who .pchip { font-size:11px; padding:3px 8px 3px 3px; }
  .r-who .pchip .dot { width:13px; height:13px; }

  /* late / overdue accents */
  .cell-time .cd.late { color:var(--alarm); font-weight:600; }
  .overdue-chip { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--alarm); margin-left:8px; white-space:nowrap; }

  /* right sidebar: Quick notes (top), then Places to Go, Bills, Shopping */
  .side { display:flex; flex-direction:column; gap:18px; }
  .notes { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
  .note-list { display:flex; flex-direction:column; gap:6px; }
  .note-row { display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border:1px solid var(--line); border-left:3px solid transparent; border-radius:9px; background:var(--surface-2); }
  .note-row.pinned { border-left-color:var(--signal); }
  .note-body { flex:1; min-width:0; }
  .note-text { font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; }
  .note-actions { display:flex; flex-direction:column; gap:4px; flex:none; }
  .note-pin, .note-del { color:var(--muted-2); background:none; border:none; cursor:pointer; font-size:13px; padding:2px 3px; line-height:1; }
  .note-pin.on { color:var(--signal); }
  .note-pin:hover { color:var(--ink); } .note-del:hover { color:var(--alarm); }

  .places { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
  .place-list { display:flex; flex-direction:column; gap:6px; }
  .place-row { display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); }
  .place-row.got { opacity:.5; } .place-row.got .place-name { text-decoration:line-through; color:var(--muted); }
  .place-body { flex:1; min-width:0; }
  .place-name { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .place-meta { font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:1px; }
  .place-meta .ptxt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .place-meta .pdot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .mapbtn { font-size:11px; font-weight:600; color:var(--signal); background:none; border:1px solid var(--line); border-radius:7px; padding:5px 9px; cursor:pointer; text-decoration:none; white-space:nowrap; flex:none; }
  .mapbtn:hover { border-color:var(--signal); }
  .place-del, .place-edit { color:var(--muted-2); background:none; border:none; cursor:pointer; font-size:13px; padding:2px 3px; flex:none; }
  .place-del:hover { color:var(--alarm); } .place-edit:hover { color:var(--ink); }
  .place-editor { border:1px solid var(--signal); border-radius:9px; padding:10px; background:var(--input-bg); box-shadow:0 0 0 2px rgba(168,85,247,.1); }
  .place-editor .pe-field { display:flex; flex-direction:column; gap:3px; margin-bottom:8px; }
  .place-editor label { font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .place-editor input[type=text], .place-editor input[type=date] { font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink); outline:none; width:100%; }
  .place-editor input:focus { border-color:var(--signal); }
  .place-editor .who-opt { font-size:11px; padding:4px 8px 4px 6px; }
  .place-editor .pe-actions { display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }

  /* bills (mirrors places to go) */
  .bills { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
  .bill-list { display:flex; flex-direction:column; gap:6px; }
  .bill-row { display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); }
  .bill-row.got { opacity:.5; } .bill-row.got .bill-name { text-decoration:line-through; color:var(--muted); }
  .bill-body { flex:1; min-width:0; }
  .bill-name { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bill-meta { font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:1px; }
  .bill-meta .ptxt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .bill-meta .bill-amt { font-family:var(--mono); font-weight:700; color:var(--signal-dim); }
  .bill-meta .due-over { color:var(--alarm); font-weight:700; }
  .bill-meta .pdot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .bill-edit, .bill-del { color:var(--muted-2); background:none; border:none; cursor:pointer; font-size:13px; padding:2px 3px; flex:none; }
  .bill-del:hover { color:var(--alarm); } .bill-edit:hover { color:var(--ink); }
  .bill-editor { border:1px solid var(--signal); border-radius:9px; padding:10px; background:var(--input-bg); box-shadow:0 0 0 2px rgba(168,85,247,.1); }
  .bill-editor .pe-field { display:flex; flex-direction:column; gap:3px; margin-bottom:8px; }
  .bill-editor label { font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .bill-editor input[type=text], .bill-editor input[type=date], .bill-editor input[type=number] { font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink); outline:none; width:100%; }
  .bill-editor input:focus { border-color:var(--signal); }
  .bill-editor .who-opt { font-size:11px; padding:4px 8px 4px 6px; }
  .bill-editor .pe-actions { display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }

  /* shopping */
  .shop { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
  .add-inline { display:flex; align-items:center; gap:8px; background:var(--input-bg); border:1px solid var(--line); border-radius:10px; padding:3px 3px 3px 12px; margin-bottom:12px; }
  .add-inline input { flex:1; border:none; outline:none; background:transparent; font-size:14px; color:var(--ink); padding:8px 0; }
  .add-inline .plus { font-family:var(--mono); color:var(--signal-dim); font-weight:700; }
  .shop-list { display:flex; flex-direction:column; gap:6px; }
  .shop-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); }
  .shop-row.got { opacity:.5; } .shop-row.got .shop-text { text-decoration:line-through; color:var(--muted); }
  .shop-text { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shop-del { color:var(--muted-2); background:none; border:none; cursor:pointer; font-size:14px; }
  .shop-del:hover { color:var(--alarm); }
  .shop-foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .shop-count { font-family:var(--mono); font-size:11.5px; color:var(--muted-2); }
  .shop-clear { font-size:12px; color:var(--muted); background:none; border:1px solid var(--line); border-radius:8px; padding:5px 9px; cursor:pointer; }
  .shop-clear:hover { border-color:var(--muted-2); color:var(--ink); }

  .empty-state { text-align:center; padding:40px 16px; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius); background:var(--card); }
  .empty-state .big { font-size:16px; font-weight:600; color:var(--ink); margin-bottom:5px; }
  .hint { font-size:11.5px; color:var(--muted-2); margin-top:22px; text-align:center; font-family:var(--mono); }

  @media (max-width:640px){
    .row { grid-template-columns:24px 48px 1fr auto; grid-template-areas:"cbx pri who actions" "cbx pri title title" "cbx pri meta meta" "cbx pri status status"; row-gap:7px; }
    .row > .cbx { grid-area:cbx; } .row > .pri{ grid-area:pri; align-self:start; } .r-who{ grid-area:who; } .r-title{ grid-area:title; } .r-meta{ grid-area:meta; display:flex; gap:12px; flex-wrap:wrap;} .r-status{ grid-area:status;} .rowactions{ grid-area:actions;}
    .cell-time{ text-align:left; }
    .editor .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>The Grind</h1>
      <div><div class="eyebrow">Personal command center</div><div class="datestr" id="datestr"></div></div>
    </div>
    <div class="head-right">
      <div class="clock" id="clock">--:--<span class="sec">:--</span></div>
      <div class="progress-wrap">
        <div class="progress-top"><span class="eyebrow">Today</span><span class="progress-count" id="progressCount">0 of 0 done</span><span class="overdue-chip" id="overdueChip"></span></div>
        <div class="bar"><span id="progressBar"></span></div>
      </div>
      <div class="util">
        <span class="sync-badge" id="syncBadge"></span>
        <button class="btn sm" id="soundToggle">Sound: On</button>
        <button class="btn sm" id="printBtn">🖨 Print</button>
        <button class="btn sm" id="exportBtn">Export</button>
        <button class="btn sm" id="importBtn">Import</button>
        <input type="file" id="importFile" accept="application/json" hidden>

  <div class="nextup empty" id="nextup"></div>

      <div class="dates-head-actions">
        <button class="btn sm" id="addDateBtn">+ Add date</button>
        <button class="btn sm" id="viewAllDatesBtn" aria-expanded="false">View all</button>
      </div>
    </div>
    <div class="dates-quick" id="datesQuick"></div>
    <div class="dates-all hidden" id="datesAll">
      <div class="dates-all-head">
        <div class="panel-title" style="margin:0">All upcoming dates</div>
        <button class="btn sm" id="closeAllDatesBtn">Close</button>
      </div>
      <div class="dates-all-list" id="datesAllList"></div>
      <button class="dates-past-toggle" id="pastDatesToggle" aria-expanded="false">Show past dates</button>
      <div class="dates-past-list hidden" id="pastDatesList"></div>
    </div>
  </div>

  <div class="peoplebar" id="peoplebar"></div>
  <div class="people-editor hidden" id="peopleEditor"></div>

  <div class="panels">
    <div>
      <div class="toolbar">
        <div class="quickadd"><span class="plus">+</span><input id="quickInput" type="text" placeholder="Add to the day, then Enter…" aria-label="Quick add"></div>
        <button class="btn add" id="addBtn">+ Add</button>
        <input class="search" id="searchInput" type="text" placeholder="Search…">
        <select class="ctrl" id="sortBy" aria-label="Sort">
          <option value="time">Sort: Time</option>
          <option value="priority">Sort: Priority</option>
          <option value="person">Sort: Profile</option>
          <option value="added">Sort: Added</option>
        </select>
        <label class="toggle"><input type="checkbox" id="hideDone"> Hide done</label>
        <label class="toggle"><input type="checkbox" id="showLater"> <span id="laterLbl">Later</span></label>
        <button class="shop-clear hidden" id="deleteCompletedBtn">Delete completed (0)</button>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="side">
      <div class="notes">
        <div class="panel-title">Quick notes <span class="shop-count" id="noteCount"></span></div>
        <div class="add-inline"><span class="plus">+</span><input id="noteInput" type="text" placeholder="Jot something down, then Enter…" aria-label="Add note"></div>

        <div class="add-inline"><span class="plus">+</span><input id="placeInput" type="text" placeholder="Add a place, then Enter…" aria-label="Add place"></div>
        <div class="place-list" id="placeList"></div>

      </div>

        <div class="panel-title">Bills <span class="shop-count" id="billCount"></span></div>

        <div class="bill-list" id="billList"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
"use strict";
const VERSION = "0.2.1-beta";

/* ---------------- storage ---------------- */
/* Grind-namespaced keys — deliberately isolated from the old Family Planner fork's `home.*`
   keys, which live at the same browser origin (GitHub Pages paths don't isolate localStorage).
   Never read from or write to `home.*` here — that data belongs to the other app. */
const K_TASKS="grind.plan.v1", K_SHOP="grind.shopping.v1", K_PEOPLE="grind.profiles.v1", K_PLACES="grind.places.v1", K_DATES="grind.dates.v1", K_BILLS="grind.bills.v1", K_PREFS="grind.viewprefs.v1", K_NOTES="grind.notes.v1", K_SETTINGS="grind.settings.v1";
function loadJSON(k){ try{ const r=localStorage.getItem(k); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveTasks(){ try{ localStorage.setItem(K_TASKS, JSON.stringify(tasks)); }catch(e){} pushCloud(); return true; }
function saveShop(){ try{ localStorage.setItem(K_SHOP, JSON.stringify(shop)); }catch(e){} pushCloud(); }
/* View-only filters (Hide done / Later) — deliberately local-only, never pushed to Firebase,
   since they're per-device display preferences, not shared planner data. */
function saveViewPrefs(){ try{ localStorage.setItem(K_PREFS, JSON.stringify({ hideDone:document.getElementById("hideDone").checked, showLater:document.getElementById("showLater").checked })); }catch(e){} }
function savePeople(){ try{ localStorage.setItem(K_PEOPLE, JSON.stringify(people)); }catch(e){} pushCloud(); }
function savePlaces(){ try{ localStorage.setItem(K_PLACES, JSON.stringify(places)); }catch(e){} pushCloud(); }
function saveDates(){ try{ localStorage.setItem(K_DATES, JSON.stringify(importantDates)); }catch(e){} pushCloud(); }
function saveBills(){ try{ localStorage.setItem(K_BILLS, JSON.stringify(bills)); }catch(e){} pushCloud(); }
function saveNotes(){ try{ localStorage.setItem(K_NOTES, JSON.stringify(notes)); }catch(e){} pushCloud(); }
/* Device-local app settings (currently just sound) — deliberately never synced through Firebase,
   never included in the cloud payload, and never touched by import, so each device keeps its own. */
function saveSettings(){ try{ localStorage.setItem(K_SETTINGS, JSON.stringify(settings)); }catch(e){} }

/* =====================================================================
   CLOUD SYNC (optional) — share one LIVE Grind across all your devices.
   Reuses the same Firebase project as the old Family Planner fork, but writes
   to its own top-level path (planners/the-grind-scattabrain-2026) — the two
   apps never share a database node, so Grind can never read, overwrite, or
   merge Family Planner data (and vice versa). Do not reuse "the-grind" as the
   APP_ID — that path was already seeded with Family Planner data while this
   app was still reading the shared home.* localStorage keys, before it had
   its own Firebase node.
   Leave apiKey blank to run local-only on this device (still works).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDTcQiFsjhSzlsEl7uPJvTtsxp798XOqIQ",
  authDomain: "family-planner-ccafc.firebaseapp.com",
  databaseURL: "https://family-planner-ccafc-default-rtdb.firebaseio.com",
  projectId: "family-planner-ccafc"
};
const APP_ID = "the-grind-scattabrain-2026";   // Grind's own Firebase node — must match on every device, never "ccafc-home"

let db=null, syncing=false, remoteApplying=false, pushTimer=null;
function syncConfigured(){ return typeof firebase!=="undefined" && !!FIREBASE_CONFIG.apiKey && !!FIREBASE_CONFIG.databaseURL; }
function initSync(){
  if(!syncConfigured()){ updateSyncBadge(false); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database().ref("planners/"+APP_ID);
    syncing=true; updateSyncBadge(true);
    db.on("value", snap=>{
      const v=snap.val();
      if(!v){ pushCloud(true); return; }                 // cloud empty → seed from this device
      remoteApplying=true;
      if(Array.isArray(v.people)) people=v.people;
      if(Array.isArray(v.tasks))  tasks=v.tasks.map(migrateTask);
      if(Array.isArray(v.shop))   shop=v.shop.map(s=>Object.assign(blankShop(),s));
      if(Array.isArray(v.places)) places=v.places.map(migratePlace);   // only overwrite if present → never erased by an old client
      if(Array.isArray(v.importantDates)) importantDates=v.importantDates.map(migrateImportantDate); // same rule → older clients never erase this
      if(Array.isArray(v.bills)) bills=v.bills.map(migrateBill);       // same rule → older clients never erase this
      if(Array.isArray(v.notes)) notes=v.notes.map(migrateNote).filter(n=>n.text!=="");       // same rule → older clients never erase this
      try{ localStorage.setItem(K_PEOPLE,JSON.stringify(people)); localStorage.setItem(K_TASKS,JSON.stringify(tasks)); localStorage.setItem(K_SHOP,JSON.stringify(shop)); localStorage.setItem(K_PLACES,JSON.stringify(places)); localStorage.setItem(K_DATES,JSON.stringify(importantDates)); localStorage.setItem(K_BILLS,JSON.stringify(bills)); localStorage.setItem(K_NOTES,JSON.stringify(notes)); }catch(e){}
      remoteApplying=false;
      // Data is always safe to merge in (every commit path re-fetches its entity by id), but a full render()
      // would blow away a focused inline editor's DOM — so defer the redraw until editing ends.
      if(!editingActive()) render(); else pendingRemoteRender=true;
    });
    firebase.database().ref(".info/connected").on("value", s=>{ if(syncing) updateSyncBadge(s.val()===true); });
  }catch(e){ syncing=false; updateSyncBadge(false); }
}
function pushCloud(force){
  if(!syncing || (remoteApplying && !force)) return;
  clearTimeout(pushTimer);
  /* update() instead of set() — a set() from this tab would blank out any top-level key it omits.
     Since a stale v1.4 tab's set() has no importantDates key, its set() would still erase importantDates
     (update() only protects against writers that also use update() with a partial payload); this change
     protects future fields added the same way, but v1.4 tabs must still be closed/refreshed — see report. */
  pushTimer=setTimeout(()=>{ try{ db.update({people,tasks,shop,places,importantDates,bills,notes,updated:Date.now()}); }catch(e){} }, 250);
}
function updateSyncBadge(on){
  const el=document.getElementById("syncBadge"); if(!el) return;
  if(!syncConfigured()){ el.textContent="○ Local only"; el.style.color="var(--muted-2)"; el.title="Add your Firebase config to sync across devices"; return; }
  el.textContent = on ? "● Synced" : "● Offline"; el.style.color = on ? "#23B877" : "var(--star)";
  el.title = on ? "Live sync on" : "Reconnecting…";
}

/* ---------------- profiles + palette ---------------- */
const PALETTE=["#16BBD4","#F06595","#9B87F5","#F2A81D","#23B877","#F0575C","#3B97E6","#E8A0C0"];
const SEED_PEOPLE=[
  {id:"p1",name:"Scatta",color:"#A855F7"},
];
let people = loadJSON(K_PEOPLE) || SEED_PEOPLE.slice();
function uid(p){ return (p||"t")+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function getPerson(id){
  if(id==="family") return {id:"family",name:"All",color:"#8595A8"};
  const p=people.find(x=>x.id===id); return p || {id:"",name:"Unassigned",color:"#3A4757",none:true};
}

/* ---------------- tasks / shopping / places ---------------- */
/* Task now stores a `people` array. "family" as a member id = everyone (exclusive).
   Old tasks used a single `person` string — migrateTask converts them, no data loss. */
function blankTask(name){ return { id:uid("t"), people:[], task:name||"", time:"", due:"", dueTime:"", priority:5, status:"todo", showOn:"", notes:"", created:Date.now() }; }
function blankShop(name){ return { id:uid("s"), item:name||"", got:false }; }
function blankPlace(name){ return { id:uid("pl"), name:name||"", address:"", note:"", date:"", people:[], visited:false, created:Date.now() }; }
function blankBill(name){ return { id:uid("b"), name:name||"", amount:"", due:"", note:"", people:[], paid:false, created:Date.now() }; }
function blankNote(text){ return { id:uid("n"), text:text||"", pinned:false, created:Date.now(), updated:Date.now() }; }

function normPeople(arr){ if(!Array.isArray(arr)) return []; if(arr.includes("family")) return ["family"]; return arr.filter(x=>x); }
function migrateTask(raw){
  const t=Object.assign(blankTask(), raw||{});
  if((!Array.isArray(t.people)||!t.people.length) && raw && raw.person){   // old single-person → array
    t.people = raw.person==="family" ? ["family"] : [raw.person];
  }
  t.people=normPeople(t.people);
  delete t.person;
  if(typeof t.created!=="number") t.created=Date.now();
  return t;
}
function migratePlace(raw){ const p=Object.assign(blankPlace(), raw||{}); p.people=normPeople(p.people); if(typeof p.created!=="number") p.created=Date.now(); return p; }
function migrateBill(raw){ const b=Object.assign(blankBill(), raw||{}); b.people=normPeople(b.people); if(typeof b.created!=="number") b.created=Date.now(); return b; }
/* Defensive against malformed/older-format notes on import: coerces text/pinned to the right
   type and backfills id/timestamps so a bad entry never crashes the app — it just becomes a
   normal (possibly blank, later filtered) note. */
function migrateNote(raw){
  const src=(raw && typeof raw==="object" && !Array.isArray(raw)) ? raw : {};
  const n=Object.assign(blankNote(), src);
  n.text=(n.text==null?"":n.text).toString().trim();
  n.pinned=!!n.pinned;
  if(typeof n.id!=="string" || n.id.trim()==="") n.id=uid("n");
  if(!Number.isFinite(n.created)) n.created=Date.now();
  if(!Number.isFinite(n.updated)) n.updated=n.created;
  return n;
}

/* ---------------- important dates ---------------- */
/* Stored separately from tasks — never appear in the task list, never affect progress/overdue/Up Next.
   Structure is deliberately calendar-shaped (startDate/endDate/startTime/endTime) so a future full
   calendar view could read this same array without a migration. */
const DATE_CATEGORIES = {
  travel:      { label:"Travel",       color:"#3B97E6" },
  school:      { label:"School",       color:"#F2A81D" },
  family:      { label:"Family",       color:"#9B87F5" },
  appointment: { label:"Appointment",  color:"#16BBD4" },
  deadline:    { label:"Deadline",     color:"#F0575C" },
  other:       { label:"Other",        color:"#66788B" },
};
function blankImportantDate(name){ return { id:uid("d"), title:name||"", startDate:"", endDate:"", startTime:"", endTime:"", people:[], location:"", note:"", category:"other", created:Date.now(), updated:Date.now() }; }
function migrateImportantDate(raw){
  const d=Object.assign(blankImportantDate(), raw||{});
  d.people=normPeople(d.people);
  if(!DATE_CATEGORIES[d.category]) d.category="other";
  if(typeof d.created!=="number") d.created=Date.now();
  if(typeof d.updated!=="number") d.updated=d.created;
  return d;
}

/* Local-calendar-date helpers — a bare "YYYY-MM-DD" is NEVER passed to `new Date()` on its own
   (that parses as UTC midnight and can shift a day in western timezones). Always attach a local
   time-of-day first, exactly like the existing dueMoment()/fmtDate() pattern below. */
function localMoment(ymd, hm){ if(!ymd) return null; const t=/^\d{2}:\d{2}$/.test(hm||"")?hm:"00:00"; const d=new Date(`${ymd}T${t}`); return isNaN(d)?null:d; }
function dayDiff(fromYmd, toYmd){ const a=localMoment(fromYmd), b=localMoment(toYmd); if(!a||!b) return 0; return Math.round((b-a)/86400000); }

let tasks = loadJSON(K_TASKS); if(!tasks){ tasks=[]; saveTasks(); }
tasks = tasks.map(migrateTask);
let shop = (loadJSON(K_SHOP) || []).map(s=>Object.assign(blankShop(),s));
let places = (loadJSON(K_PLACES) || []).map(migratePlace);

let settings = Object.assign({ soundEnabled:true }, loadJSON(K_SETTINGS)||{});

/* ---------------- state ---------------- */
let editingId=null, placeEditingId=null, dateEditingId=null, billEditingId=null, activePerson="all", overdueSet=new Set();
let datesAllOpen=false, pastDatesOpen=false;
let pendingRemoteRender=false;
/* Shared inline-edit / popover tracker (text fields + people/category/date-time/priority popovers).
   Only one of these may be open at a time; opening a new one commits/closes whatever is open. */
let activeEdit=null; // { type, id, field, close(cancel) }
function editingActive(){ return editingId!=null || placeEditingId!=null || dateEditingId!=null || billEditingId!=null || !!activeEdit; }

/* =====================================================================
   SHARED INLINE-EDIT / POPOVER SYSTEM
   One editor (text field or popover) open at a time, tracked in `activeEdit`.
   Opening a new one commits/closes whatever is currently open first.
   Every commit path re-fetches its entity by id via getEntity() — never a
   closure-captured object — the exact pattern that fixed the Edit Family bug.
   ===================================================================== */
function closeActiveEdit(commit){
  if(!activeEdit) return;
  const a=activeEdit; activeEdit=null;
  try{ a.close(commit!==false); }catch(e){}
}
function isEditingField(type,id,field){ return !!activeEdit && activeEdit.type===type && activeEdit.id===id && (field==null || activeEdit.field===field); }
function isEditingEntity(type,id){ return isEditingField(type,id,null); }

/* Click-to-edit text field: swaps `container`'s content for an <input>/<textarea>.
   Enter commits (never inserts a newline). Blur commits. Escape restores + cancels.
   Blank required values restore the previous value. Saves once, not per keystroke. */
function startInlineText(opts){
  const {type,id,field,container,value,placeholder,ariaLabel,required=true,multiline=false,getEntity,onCommit,onDone}=opts;
  closeActiveEdit(true);
  let finished=false;
  const original=value||"";
  const input=document.createElement(multiline?"textarea":"input");
  if(!multiline) input.type="text";
  input.className=multiline?"inline-textarea":"inline-input";
  input.value=original;
  if(placeholder) input.placeholder=placeholder;
  input.setAttribute("aria-label", ariaLabel||field);
  container.innerHTML=""; container.appendChild(input);
  input.focus(); if(input.select) input.select();
  function finish(save){
    if(finished) return; finished=true;
    if(activeEdit && activeEdit.type===type && activeEdit.id===id && activeEdit.field===field) activeEdit=null;
    if(save){
      const entity=getEntity();
      if(entity){ let v=input.value.trim(); if(required && !v) v=original; if(v!==original) onCommit(entity,v); }
    }
    if(onDone) onDone();
  }
  input.addEventListener("blur",()=>finish(true));
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); input.blur(); }
    else if(e.key==="Escape"){ e.preventDefault(); finish(false); }
  });
  activeEdit={type,id,field,close:finish};
}

/* Popovers attach to <body> as position:fixed overlays — deliberately NOT nested inside the
   row/card DOM, so a render() elsewhere (Firebase sync, another row's edit) can never destroy
   an open popover. Closes + commits on outside click, Escape, or page scroll. */
function clampPopoverToAnchor(pop, anchor){
  const r=anchor.getBoundingClientRect();
  pop.style.visibility="hidden";
  document.body.appendChild(pop);
  const pr=pop.getBoundingClientRect();
  const vw=window.innerWidth, vh=window.innerHeight;
  let left=r.left, top=r.bottom+6;
  if(left+pr.width>vw-8) left=Math.max(8,vw-8-pr.width);
  if(left<8) left=8;
  if(top+pr.height>vh-8) top=Math.max(8,r.top-pr.height-6);
  if(top<8) top=8;
  pop.style.left=left+"px"; pop.style.top=top+"px"; pop.style.visibility="visible";
}
function openPopover(opts){
  const {type,id,field,anchor,build,onClose}=opts;
  if(isEditingField(type,id,field)){ closeActiveEdit(true); return null; } // second click on same field = toggle closed
  closeActiveEdit(true);
  const pop=document.createElement("div"); pop.className="popover"; pop.setAttribute("role","dialog"); pop.tabIndex=-1;
  let closed=false;
  function closeThis(commit){
    if(closed) return; closed=true;
    document.removeEventListener("mousedown", onDocDown, true);
    document.removeEventListener("keydown", onDocKey, true);
    window.removeEventListener("scroll", onScroll, true);
    if(activeEdit && activeEdit.type===type && activeEdit.id===id && activeEdit.field===field) activeEdit=null;
    pop.remove();
    if(onClose) onClose(commit!==false);
  }
  function onDocDown(e){ if(!pop.contains(e.target) && e.target!==anchor && !anchor.contains(e.target)) closeThis(true); }
  function onDocKey(e){ if(e.key==="Escape"){ e.preventDefault(); closeThis(false); } }
  function onScroll(){ closeThis(true); } // popovers auto-save per interaction, so nothing is lost — just avoid a floating popover mid-scroll
  build(pop, closeThis);
  clampPopoverToAnchor(pop, anchor);
  const first=pop.querySelector("input,select,button,textarea"); if(first) first.focus();
  document.addEventListener("mousedown", onDocDown, true);
  document.addEventListener("keydown", onDocKey, true);
  window.addEventListener("scroll", onScroll, true);
  activeEdit={type,id,field,close:closeThis};
  return {el:pop, close:closeThis};
}
const STATUS={ todo:{label:"To do",color:"#7C8B9C"}, doing:{label:"Doing",color:"#3B97E6"}, done:{label:"Done",color:"#23B877"}, later:{label:"Later",color:"#9B87F5"} };

/* ---------------- helpers ---------------- */
function pad2(x){ return String(x).padStart(2,"0"); }
function priColor(p){ const green=[0x23,0xB8,0x77],amber=[0xF2,0xA8,0x1D],red=[0xF0,0x57,0x5C]; const t=(Math.min(10,Math.max(1,p))-1)/9; const mix=(a,b,u)=>a.map((x,i)=>Math.round(x+(b[i]-x)*u)); const c=t<=0.5?mix(green,amber,t/0.5):mix(amber,red,(t-0.5)/0.5); return "#"+c.map(x=>x.toString(16).padStart(2,"0")).join(""); }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function timeToMin(h){ if(!h) return null; const [a,b]=h.split(":").map(Number); return a*60+b; }
function fmtDelta(m){ const a=Math.abs(m); if(a>=60){ const h=Math.floor(a/60),n=a%60; return n?`${h}h ${n}m`:`${h}h`; } return a+"m"; }
function fmt12(hhmm){ if(!hhmm) return ""; let [h,m]=hhmm.split(":").map(Number); const ap=h<12?"AM":"PM"; h=h%12||12; return `${h}:${pad2(m)} ${ap}`; }
function fmtDate(ymd){ const d=new Date(ymd+"T00:00"); return isNaN(d)?ymd:d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtWhen(iso){ const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function isDone(t){ return t.status==="done"; }
function isLater(t){ return t.status==="later"; }
function isActive(t){ return t.status==="todo"||t.status==="doing"; }
function esc(s){ return (s??"").toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

/* ---------------- completion sound ---------------- */
/* One shared chime for every "incomplete → complete" checkbox across the app (tasks, bills,
   shopping, places) — deliberately not duplicated per-handler. Built with Web Audio (no external
   file); the AudioContext is created lazily on first use, since creating one before any user
   gesture triggers browser autoplay warnings and some browsers start it "suspended" until a
   gesture unlocks it. Every failure path (blocked/unavailable audio, suspended context that
   won't resume, etc.) is swallowed so a sound problem can never break the actual checkbox action. */
let audioCtx=null;
function playCompletionSound(){
  if(!settings.soundEnabled) return;
  try{
    if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; audioCtx=new AC(); }
    if(audioCtx.state==="suspended") audioCtx.resume().catch(()=>{});
    const now=audioCtx.currentTime;
    const gain=audioCtx.createGain();
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.2, now+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.5);
    [659.25, 987.77].forEach((freq,i)=>{   // soft two-tone rise (E5 → B5), ~500ms total
      const osc=audioCtx.createOscillator();
      osc.type="sine"; osc.frequency.value=freq;
      osc.connect(gain);
      const start=now+i*0.12;
      osc.start(start); osc.stop(start+0.32);
    });
  }catch(e){ /* audio unavailable or blocked — fail silently, never breaks the checkbox action */ }
}
function taskPeopleIds(t){ return Array.isArray(t.people)?t.people:[]; }
function isFamilyTask(t){ return taskPeopleIds(t).includes("family"); }
/* a task "counts toward today" if it's undated (a floating today task) or due today; not later */
function isToday(t){ if(isLater(t)) return false; if(!t.due) return true; return t.due===todayStr(); }
function personSortKey(t){ const ids=taskPeopleIds(t); if(!ids.length) return "~~~~"; if(ids.includes("family")) return "\u0000Family"; return getPerson(ids[0]).name; }
function tomorrowLocal(timeStr){ const d=new Date(); d.setDate(d.getDate()+1); const t=/^\d{2}:\d{2}$/.test(timeStr||"")?timeStr:"08:00"; return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${t}`; }
function dueMoment(t){ if(!t.due) return null; const tm=/^\d{2}:\d{2}$/.test(t.dueTime||"")?t.dueTime:"23:59"; const d=new Date(`${t.due}T${tm}`); return isNaN(d)?null:d; }
function isOverdue(t){ if(!isActive(t)) return false; return !!t.due && t.due < todayStr(); }
function dueBadge(t){ if(!t.due||isDone(t)) return "";
  const ts=todayStr();
  if(t.due < ts) return `<span class="due over">⚠ Overdue · was due ${esc(fmtDate(t.due))}</span>`;
  if(t.due === ts) return `<span class="due today">due today${t.dueTime?" "+esc(fmt12(t.dueTime)):""}</span>`;
  const dd=new Date(t.due+"T00:00"), today=new Date(ts+"T00:00"); const diff=Math.round((dd-today)/86400000);
  if(diff===1) return `<span class="due soon">due tomorrow</span>`;
  return `<span class="due">due ${esc(fmtDate(t.due))}</span>`;
}
function normalizeLater(){ let ch=false; const now=new Date(); tasks.forEach(t=>{ if(isLater(t)&&t.showOn&&new Date(t.showOn)<=now){ t.status="todo"; t.showOn=""; ch=true; } }); if(ch) saveTasks(); return ch; }

/* ---------------- important-date status / countdown ---------------- */
function isDateRange(d){ return !!d.startDate && !!d.endDate && d.endDate!==d.startDate; }
function dateEndMoment(d){ const endYmd=d.endDate||d.startDate; if(!endYmd) return null; const tm=/^\d{2}:\d{2}$/.test(d.endTime||"")?d.endTime:"23:59"; return localMoment(endYmd,tm); }
function isPastDate(d){ const end=dateEndMoment(d); if(!end) return false; return new Date()>end; }
function fmtCountdownDays(n){ if(n===1) return "Tomorrow"; if(n<14) return `In ${n} days`; const w=Math.round(n/7); return `In ${w} week${w===1?"":"s"}`; }
function dateCountdown(d){
  if(!d.startDate) return "";
  const ts=todayStr(), start=d.startDate, end=d.endDate||d.startDate;
  if(ts<start){ const n=dayDiff(ts,start); return n<=0?"Today":fmtCountdownDays(n); }
  if(ts<=end){
    if(isDateRange(d)){
      if(ts===end) return "Ends today";
      const n=dayDiff(ts,end);
      return n===1?"Ends tomorrow":`Ends in ${n} days`;
    }
    const now=new Date(); const sm=localMoment(start,d.startTime||"00:00"); const em=dateEndMoment(d);
    if(d.startTime && sm && em && now>=sm && now<=em) return "Happening now";
    return "Today";
  }
  return "Ended";
}
function isOngoingLabel(label){ return label==="Happening now" || label.indexOf("Ends")===0; }
/* Date and time are rendered (and edited) as two separate clickable targets — "Date or date range"
   is edited together as one field per spec, "Time" is its own field. */
function dateDatePartText(d){ if(!d.startDate) return "Set date"; let s=fmtDate(d.startDate); if(isDateRange(d)) s+=" – "+fmtDate(d.endDate); return s; }
function dateTimePartText(d){ let s=d.startTime?fmt12(d.startTime):""; if(d.endTime && d.endTime!==d.startTime) s+=(s?" – ":"")+fmt12(d.endTime); return s; }
function validateImportantDate(startDate,endDate,startTime,endTime){
  if(!startDate) return "Start date is required.";
  if(endDate && endDate<startDate) return "End date cannot be before start date.";
  if((!endDate || endDate===startDate) && startTime && endTime && endTime<startTime) return "End time cannot be before start time.";
  return null;
}
function activeDatesSorted(){
  return importantDates.filter(d=>!isPastDate(d)).sort((a,b)=>
    (a.startDate||"9999-99-99").localeCompare(b.startDate||"9999-99-99") ||
    (a.startTime||"00:00").localeCompare(b.startTime||"00:00") ||
    (a.created||0)-(b.created||0));
}
function pastDatesSorted(){
  return importantDates.filter(isPastDate).sort((a,b)=>
    (b.endDate||b.startDate||"").localeCompare(a.endDate||a.startDate||"") || (b.created||0)-(a.created||0));
}

/* ---------------- next up ---------------- */
function personVisible(t){ if(activePerson==="all") return true; if(isFamilyTask(t)) return true; return taskPeopleIds(t).includes(activePerson); }
/* Up Next = soonest FUTURE timed task today. Missed (past-time) tasks are flagged in their row, not here. */
function computeNextUp(){
  const nm=nowMin();
  const c=tasks.filter(t=>isActive(t)&&isToday(t)&&personVisible(t)&&timeToMin(t.time)!=null&&timeToMin(t.time)>=nm);
  if(!c.length) return null;
  c.sort((a,b)=>timeToMin(a.time)-timeToMin(b.time));
  return c[0];
}
/* colored chips for a task's assigned people (Family collapses to one chip) */
function peopleChipsHtml(ids){
  ids = normPeople(ids);
  if(!ids.length) return `<span class="pchip none"><span class="dot"></span>—</span>`;
  if(ids.includes("family")){ const f=getPerson("family"); return `<span class="pchip" style="background:${f.color}"><span class="dot"></span>All</span>`; }
  return ids.map(id=>{ const p=getPerson(id); return `<span class="pchip" style="background:${p.color}"><span class="dot"></span>${esc(p.name)}</span>`; }).join("");
}
/* incomplete active tasks assigned to this person (family tasks count for everyone) */
function personCount(pid){ return tasks.filter(t=>isActive(t) && (isFamilyTask(t)||taskPeopleIds(t).includes(pid))).length; }
/* reusable multi-person selector; returns { get:()=>ids }. Family and individuals are mutually exclusive.
   Optional onChange(ids) fires after a real selection change (never during initial paint), with a
   freshly-normalized array — never the picker's internal mutable one. */
function makeWhoPicker(container, initial, onChange){
  let sel = normPeople(initial);
  function paint(){
    const opt=(id,name,color,on)=>`<button type="button" class="who-opt ${on?'on':''}" data-id="${id}"><span class="dot" style="background:${color}"></span>${esc(name)}</button>`;
    container.innerHTML = opt("family","All profiles",getPerson("family").color,sel.includes("family")) +
      people.map(p=>opt(p.id,p.name,p.color,sel.includes(p.id))).join("");
    container.querySelectorAll(".who-opt").forEach(b=>b.addEventListener("click",()=>{
      const before=normPeople(sel);
      const id=b.dataset.id;
      if(id==="family") sel = sel.includes("family") ? [] : ["family"];
      else { sel=sel.filter(x=>x!=="family"); sel = sel.includes(id) ? sel.filter(x=>x!==id) : [...sel,id]; }
      const after=normPeople(sel);
      sel=after;
      paint();
      const changed = before.length!==after.length || before.some((v,i)=>v!==after[i]);
      if(changed && typeof onChange==="function") onChange(after);
    }));
  }
  paint();
  return { get:()=>normPeople(sel) };
}

/* ---------------- render ---------------- */
const listEl=document.getElementById("list"), nextEl=document.getElementById("nextup");

function currentView(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const sort=document.getElementById("sortBy").value;
  const hideDone=document.getElementById("hideDone").checked;
  const showLater=document.getElementById("showLater").checked;
  let v=tasks.filter(t=>{
    if(!personVisible(t)) return false;
    if(isLater(t)&&!showLater) return false;
    if(hideDone&&isDone(t)) return false;
    if(q){ const names=taskPeopleIds(t).map(id=>getPerson(id).name).join(" "); const hay=[t.task,t.notes,names].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const cmp={
    time:(a,b)=>(timeToMin(a.time)??1e9)-(timeToMin(b.time)??1e9),
    priority:(a,b)=>(b.priority||0)-(a.priority||0),
    person:(a,b)=>personSortKey(a).localeCompare(personSortKey(b)),
    added:(a,b)=>(b.created||0)-(a.created||0),
  }[sort] || ((a,b)=>0);
  const secondary=(a,b)=> ((b.priority||0)-(a.priority||0)) || ((timeToMin(a.time)??1e9)-(timeToMin(b.time)??1e9));
  const tier=t=>isLater(t)?2:isDone(t)?1:0;
  v.sort((a,b)=>(tier(a)-tier(b)) || cmp(a,b) || secondary(a,b));
  return v;
}

function render(){
  normalizeLater();
  renderPeopleBar();
  renderNotes();
  renderShop();
  renderPlaces();
  renderBills();
  renderDatesSection();
  const view=currentView();
  const next=computeNextUp();
  const laterCount=tasks.filter(isLater).length;
  document.getElementById("laterLbl").textContent=laterCount?`Later (${laterCount})`:"Later";
  renderNextUp(next);
  renderProgress();

  listEl.innerHTML="";
  if(!tasks.length){ listEl.innerHTML=`<div class="empty-state"><div class="big">No plans yet.</div>Add the first thing for today above, and tag who it's for.</div>`; }
  else if(!view.length){ listEl.innerHTML=`<div class="empty-state"><div class="big">Nothing here.</div>Try another person or clear filters.</div>`; }
  overdueSet=new Set(tasks.filter(isOverdue).map(t=>t.id)); let laterShown=false;
  view.forEach(t=>{
    if(isLater(t)&&!laterShown){ const h=document.createElement("div"); h.className="later-head"; h.textContent="◴ Moved to later"; listEl.appendChild(h); laterShown=true; }
    if(editingId===t.id) listEl.appendChild(renderEditor(t)); else listEl.appendChild(renderRow(t,next&&next.id===t.id));
  });

  document.getElementById("hint").textContent=`${tasks.length} items • ${done} done • ${over} overdue • ${laterCount} later • ${places.filter(p=>!p.visited).length} places • ${shop.filter(s=>!s.got).length} to buy • ${bills.filter(b=>!b.paid).length} bills due • The Grind v${VERSION}`;
}

function renderProgress(){
  const todays=tasks.filter(isToday); const tot=todays.length; const done=todays.filter(isDone).length;
  document.getElementById("progressCount").textContent=`${done} of ${tot} done`;
  document.getElementById("progressBar").style.width=tot?(done/tot*100)+"%":"0%";
  const over=tasks.filter(isOverdue).length;

}

function renderPeopleBar(){

function togglePeopleEditor(){ closeActiveEdit(true); const pe=document.getElementById("peopleEditor"); pe.classList.toggle("hidden"); if(!pe.classList.contains("hidden")) renderPeopleEditor(); }
function renderPeopleEditor(){
  const pe=document.getElementById("peopleEditor");
  pe.innerHTML=`<div class="panel-title">Profiles</div>`+
    people.map(p=>`<div class="pe-row" data-id="${p.id}"><button class="swatch" style="background:${p.color}" title="Change color"></button><input type="text" value="${esc(p.name)}" placeholder="Name"><button class="rm" title="Remove">✕</button></div>`).join("")+
    `<button class="btn sm" id="peAdd">+ Add profile</button>`;
  pe.querySelectorAll(".pe-row").forEach(row=>{
    const id=row.dataset.id;
    const nameInput=row.querySelector("input");
    const commitName=()=>{
      const person=people.find(x=>x.id===id); if(!person) return;
      const name=nameInput.value.trim();
      if(!name){ nameInput.value=person.name; return; }
      if(name===person.name){ nameInput.value=name; return; }

    };
    nameInput.addEventListener("blur",commitName);

function renderRow(t,isNext){

  const noteHtml = t.notes ? `<span class="task-note" id="r-notes">${esc(t.notes)}</span>` : "";

  const metaHtml = metaParts.length ? `<div class="task-meta">${metaParts.join(' <span style="opacity:.4">·</span> ')}</div>` : "";
  const s=timeToMin(t.time); let cd="";
  if(s!=null&&isActive(t)){ const d=s-nowMin();
    if(d>0&&d<=60) cd=`<span class="cd">in ${fmtDelta(d)}</span>`;
    else if(d===0) cd=`<span class="cd">now</span>`;
    else if(d<0) cd=`<span class="cd late">▲ ${fmtDelta(d)} late</span>`;

    <input type="checkbox" class="cbx" ${isDone(t)?"checked":""} aria-label="Done">

  wireTaskPriority(el.querySelector("#r-pri"), t.id);
  wireTaskPeople(el.querySelector("#r-who"), t.id);

  wireTaskTime(el.querySelector("#r-time"), t.id);

  el.querySelector(".status-sel").addEventListener("change",e=>{ const v=e.target.value; const cur=tasks.find(x=>x.id===t.id); if(!cur) return;
    if(v==="tomorrow"){ cur.status="later"; cur.showOn=tomorrowLocal(cur.time||"08:00"); saveTasks(); render(); }
    else if(v==="pickday"){ cur.status="later"; if(!cur.showOn) cur.showOn=tomorrowLocal(cur.time||"08:00"); closeActiveEdit(true); editingId=cur.id; render(); }
    else if(v==="later"){ /* no-op */ }
    else { cur.status=v; cur.showOn=""; saveTasks(); render(); } });

  el.querySelector(".del").addEventListener("click",()=>{ if(confirm(`Delete "${t.task||"this item"}"?`)){ tasks=tasks.filter(x=>x.id!==t.id); saveTasks(); render(); } });

  el.querySelector(".cancel-e").addEventListener("click",()=>{ const cur=tasks.find(x=>x.id===taskId); if(cur && !cur.task&&!cur.notes&&!cur.time&&!cur.due&&!cur.people.length) tasks=tasks.filter(x=>x.id!==taskId); editingId=null; render(); });

}

/* ---------------- places to go ---------------- */
function mapUrl(addr){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr); }
function placePeopleDots(ids){ ids=normPeople(ids); if(!ids.length) return ""; if(ids.includes("family")) return `<span class="pdot" style="background:${getPerson("family").color}" title="All"></span>`; return ids.map(id=>{const p=getPerson(id);return `<span class="pdot" style="background:${p.color}" title="${esc(p.name)}"></span>`;}).join(""); }
/* Quick-glance order: unvisited+dated (soonest first), then unvisited+undated, then visited (newest first). */
function sortedPlaces(){
  return [...places].sort((a,b)=>{
    const ka=a.visited?2:(a.date?0:1), kb=b.visited?2:(b.date?0:1);
    if(ka!==kb) return ka-kb;
    if(ka===0) return (a.date||"").localeCompare(b.date||"") || (b.created||0)-(a.created||0);
    return (b.created||0)-(a.created||0);
  });
}
function renderPlaces(){
  const el=document.getElementById("placeList");
  el.innerHTML = places.length ? "" : `<div class="empty-state" style="padding:24px 12px"><div class="big">No places yet.</div>Add somewhere to go above.</div>`;
  sortedPlaces().forEach(pl=>{ el.appendChild(placeEditingId===pl.id ? renderPlaceEditor(pl) : renderPlaceRow(pl)); });
  const active=places.filter(p=>!p.visited).length, visited=places.filter(p=>p.visited).length;
  document.getElementById("placeCount").textContent=places.length?`${active}`:"";
  document.getElementById("placeStatus").textContent=`${active} to visit · ${visited} visited`;
}

function fmtMoney(n){ const v=parseFloat(n); if(isNaN(v)) return ""; return "$"+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* Quick-glance order: unpaid+due (soonest first), then unpaid+no due date, then paid (newest first). */
function sortedBills(){
  return [...bills].sort((a,b)=>{
    const ka=a.paid?2:(a.due?0:1), kb=b.paid?2:(b.due?0:1);
    if(ka!==kb) return ka-kb;
    if(ka===0) return (a.due||"").localeCompare(b.due||"") || (b.created||0)-(a.created||0);
    return (b.created||0)-(a.created||0);
  });
}
function renderBills(){
  const el=document.getElementById("billList");
  el.innerHTML = bills.length ? "" : `<div class="empty-state" style="padding:24px 12px"><div class="big">No bills yet.</div>Add one to track above.</div>`;
  sortedBills().forEach(b=>{ el.appendChild(billEditingId===b.id ? renderBillEditor(b) : renderBillRow(b)); });
  const active=bills.filter(b=>!b.paid).length, paid=bills.filter(b=>b.paid).length;
  document.getElementById("billCount").textContent=bills.length?`${active}`:"";
  document.getElementById("billStatus").textContent=`${active} due · ${paid} paid`;
}

function renderDatesQuick(){
  const wrap=document.getElementById("datesQuick");
  const list=activeDatesSorted();
  let show=list.slice(0,5);
  /* While the View All panel is open, IT is the exclusive host for the full editor — never duplicate
     it here too. Only pull the in-progress edit into the quick view when View All is closed. */
  if(!datesAllOpen && dateEditingId && !show.some(d=>d.id===dateEditingId)){
    const ed=importantDates.find(d=>d.id===dateEditingId);
    if(ed) show=[ed, ...show.filter(d=>d.id!==dateEditingId).slice(0,4)];
  }
  wrap.innerHTML="";
  if(!show.length){
    const empty=document.createElement("div"); empty.className="dates-empty";
    empty.innerHTML=`No upcoming dates yet. <button class="btn sm" id="addDateBtnEmpty">+ Add date</button>`;
    wrap.appendChild(empty);
    empty.querySelector("#addDateBtnEmpty").addEventListener("click",addImportantDate);
    return;
  }
  show.forEach(d=>{ const useEditor=!datesAllOpen && dateEditingId===d.id; wrap.appendChild(useEditor ? renderDateEditorCard(d) : renderDateCard(d)); });
  if(list.length>show.length){
    const more=document.createElement("div"); more.className="dates-more"; more.tabIndex=0; more.setAttribute("role","button");
    more.setAttribute("aria-label", `${list.length-show.length} more upcoming dates — view all`);

    const openAll=()=>{ datesAllOpen=true; renderDatesSection(); };
    more.addEventListener("click",openAll);
    more.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openAll(); } });
    wrap.appendChild(more);
  }
}

        const startDate=pop.querySelector("#pop-start").value, endDate=pop.querySelector("#pop-end").value;
        const msg=validateImportantDate(startDate,endDate,d.startTime,d.endTime);
        if(msg){ err.textContent=msg; err.style.display="block"; return false; }
        err.style.display="none";
        if(startDate!==d.startDate||endDate!==d.endDate){ d.startDate=startDate; d.endDate=endDate; d.updated=Date.now(); saveDates(); renderDatesSection(); }
        return true;
      }
      pop.querySelector("#pop-start").addEventListener("change",commit);
      pop.querySelector("#pop-end").addEventListener("change",commit);
      pop.querySelector("#pop-clear").addEventListener("click",()=>{ const d=importantDates.find(x=>x.id===dateId); if(!d) return; d.endDate=""; d.updated=Date.now(); saveDates(); renderDatesSection(); pop.querySelector("#pop-end").value=""; });
      pop.querySelector("#pop-done").addEventListener("click",()=>{ if(commit()) close(true); });
    },
    onClose(){ renderDatesSection(); }
  });
}
function openDateTimePopover(anchor, dateId){

  openPopover({ type:"date", id:dateId, field:"time", anchor,

        <div class="pop-row"><div style="flex:1"><label>Start time</label><input type="time" id="pop-stime" aria-label="Start time"></div></div>
        <div class="pop-row"><div style="flex:1"><label>End time (optional)</label><input type="time" id="pop-etime" aria-label="End time"></div></div>
        <div id="pop-err" style="color:var(--alarm);font-size:11px;display:none;"></div>
        <div class="pop-actions"><button class="pop-clear" id="pop-clear">Clear</button><button class="btn sm" id="pop-done">Done</button></div>`;
      pop.querySelector("#pop-stime").value=d0.startTime||""; pop.querySelector("#pop-etime").value=d0.endTime||"";
      const err=pop.querySelector("#pop-err");
      function commit(){
        const d=importantDates.find(x=>x.id===dateId); if(!d) return false;
        const startTime=pop.querySelector("#pop-stime").value, endTime=pop.querySelector("#pop-etime").value;
        const msg=validateImportantDate(d.startDate,d.endDate,startTime,endTime);
        if(msg){ err.textContent=msg; err.style.display="block"; return false; }
        err.style.display="none";
        if(startTime!==d.startTime||endTime!==d.endTime){ d.startTime=startTime; d.endTime=endTime; d.updated=Date.now(); saveDates(); renderDatesSection(); }
        return true;
      }
      pop.querySelector("#pop-stime").addEventListener("change",commit);
      pop.querySelector("#pop-etime").addEventListener("change",commit);
      pop.querySelector("#pop-clear").addEventListener("click",()=>{ const d=importantDates.find(x=>x.id===dateId); if(!d) return; d.startTime=""; d.endTime=""; d.updated=Date.now(); saveDates(); renderDatesSection(); close(true); });
      pop.querySelector("#pop-done").addEventListener("click",()=>{ if(commit()) close(true); });
    },
    onClose(){ renderDatesSection(); }
  });
}
function openDateCategoryPopover(anchor, dateId){
  const d0=importantDates.find(x=>x.id===dateId); if(!d0) return;
  openPopover({ type:"date", id:dateId, field:"category", anchor,
    build(pop,close){
      pop.innerHTML=`<div class="pop-title">Category</div>`+Object.entries(DATE_CATEGORIES).map(([k,c])=>
        `<button type="button" class="who-opt ${k===d0.category?'on':''}" data-k="${k}" style="width:100%;justify-content:flex-start;margin-bottom:4px;"><span class="dot" style="background:${c.color}"></span>${esc(c.label)}</button>`).join("");
      pop.querySelectorAll("button[data-k]").forEach(b=>b.addEventListener("click",()=>{
        const d=importantDates.find(x=>x.id===dateId); if(!d) return;
        d.category=b.dataset.k; d.updated=Date.now(); saveDates(); renderDatesSection(); close(true);
      }));
    }

}
function openDatePeoplePopover(anchor, dateId){
  const d0=importantDates.find(x=>x.id===dateId); if(!d0) return;
  openPopover({ type:"date", id:dateId, field:"people", anchor,
    build(pop,close){
      pop.innerHTML=`<div class="pop-title">Who's involved</div><div class="who-picker" id="pop-who"></div><div class="pop-actions"><button class="btn sm" id="pop-done">Done</button></div>`;
      makeWhoPicker(pop.querySelector("#pop-who"), d0.people, ids=>{
        const d=importantDates.find(x=>x.id===dateId); if(!d) return;
        d.people=ids; d.updated=Date.now(); saveDates(); renderDatesSection();
      });
      pop.querySelector("#pop-done").addEventListener("click",()=>close(true));
    },
