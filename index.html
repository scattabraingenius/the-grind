/* =====================================================================
   NAMED FOCUS PRESETS
   Reusable list/save/edit modal chrome
   views swapped into one #presetModalBackdrop/#presetModal, focus trap,
   Escape, backdrop click, focus restore). A preset is nothing more than
   a named, saved activeProfiles combination — applying one only ever
   swaps activeProfiles and calls render(); it never touches planner data
   or introduces a second filtering path (see applyFocusPreset() above).
   ===================================================================== */
let presetPrevFocus=null, presetView="manage", presetEditId=null, presetDraft=null, presetDraftDirty=false;
function openPresetModal(view){
  closeActiveEdit(false); // opening this modal must never commit/save whatever inline edit was active
  presetPrevFocus=document.activeElement;
  presetEditId=null; presetDraft=null; presetDraftDirty=false;
  presetView=view||"manage";
  renderPresetModal();
  document.getElementById("presetModalBackdrop").classList.remove("hidden");
  document.addEventListener("keydown", presetModalKeyHandler, true);
  document.getElementById("presetModal").focus();
}
function closePresetModal(){
  document.getElementById("presetModalBackdrop").classList.add("hidden");
  document.removeEventListener("keydown", presetModalKeyHandler, true);
  presetEditId=null; presetDraft=null; presetDraftDirty=false;
  if(presetPrevFocus && typeof presetPrevFocus.focus==="function") presetPrevFocus.focus();
  presetPrevFocus=null;
}
function requestClosePresetModal(){
  if(presetView==="edit" && presetDraftDirty){ if(!confirm("Discard unsaved changes to this preset?")) return; }
  closePresetModal();
}
function presetModalKeyHandler(e){
  if(e.key==="Escape"){
    e.preventDefault();
    if(presetView==="edit") cancelEditFocusPreset(); else requestClosePresetModal();
    return;
  }
  if(e.key!=="Tab") return;
  const modal=document.getElementById("presetModal");
  const focusables=[...modal.querySelectorAll('button,input,select,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled && el.offsetParent!==null);
  if(!focusables.length) return;
  const first=focusables[0], last=focusables[focusables.length-1];
  if(document.activeElement===modal || !modal.contains(document.activeElement)){ e.preventDefault(); (e.shiftKey?last:first).focus(); }
  else if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
document.getElementById("presetModalBackdrop").addEventListener("mousedown",e=>{ if(e.target.id==="presetModalBackdrop"){ e.preventDefault(); requestClosePresetModal(); } });

function renderPresetModal(){
  const body=document.getElementById("presetModalBody");
  if(presetView==="edit") body.innerHTML=presetEditHtml();
  else if(presetView==="save") body.innerHTML=presetSaveHtml();
  else body.innerHTML=presetListHtml();
  wirePresetModalBody();
}
function presetListHtml(){
  const head=`<h2 id="presetModalTitle">Manage focus presets</h2>`;
  if(!focusPresets.length){
    return head+`<div class="tpl-empty">No saved presets yet.</div><div class="pm-actions"><button class="btn" id="presetCloseBtn">Close</button></div>`;
  }
  const cards=focusPresets.map((p,i)=>{
    const names = p.profileIds.length ? p.profileIds.map(id=>{ const per=people.find(x=>x.id===id); return per?esc(per.name):null; }).filter(Boolean).join(", ") : "Shared only";
    return `<div class="tpl-card" data-id="${esc(p.id)}">
      <div class="tpl-card-info"><div class="tpl-card-name">${esc(p.name)}</div><div class="tpl-card-count">${names}</div></div>
      <div class="tpl-card-actions">
        <button class="btn sm preset-up" title="Move up" aria-label="Move ${esc(p.name)} up" ${i===0?"disabled":""}>↑</button>
        <button class="btn sm preset-down" title="Move down" aria-label="Move ${esc(p.name)} down" ${i===focusPresets.length-1?"disabled":""}>↓</button>
        <button class="btn sm preset-edit" aria-label="Edit ${esc(p.name)}">Edit</button>
        <button class="btn sm preset-dup" aria-label="Duplicate ${esc(p.name)}">Duplicate</button>
        <button class="btn sm preset-del" aria-label="Delete ${esc(p.name)}">Delete</button>
      </div>
    </div>`;
  }).join("");
  return head+`<div class="tpl-list">${cards}</div><div class="pm-actions"><button class="btn" id="presetCloseBtn">Close</button></div>`;
}
function presetSaveHtml(){
  return `<h2 id="presetModalTitle">Save current focus</h2>
    <div class="pm-sub">Saves which profiles are enabled right now as a reusable, named preset.</div>
    <div class="field"><label for="presetSaveName">Preset name</label><input type="text" id="presetSaveName" value="" placeholder="e.g. Work" aria-label="Preset name"></div>
    <div class="pm-actions"><button class="btn" id="presetSaveCancel">Cancel</button><button class="btn add" id="presetSaveConfirm">Save</button></div>`;
}
function presetEditHtml(){
  const d=presetDraft;
  const checks=people.map(p=>`<label class="preset-check-row"><input type="checkbox" class="preset-check" data-id="${esc(p.id)}" ${d.profileIds.includes(p.id)?"checked":""}> ${esc(p.name)}</label>`).join("");
  return `<h2 id="presetModalTitle">Edit preset</h2>
    <div class="field"><label for="presetEditName">Preset name</label><input type="text" id="presetEditName" value="${esc(d.name)}" aria-label="Preset name"></div>
    <div class="preset-check-list">${checks || `<div class="tpl-empty">No profiles exist yet.</div>`}</div>
    <div class="pm-actions"><button class="btn" id="presetEditCancel">Cancel</button><button class="btn add" id="presetEditSave">Save</button></div>`;
}
function wirePresetModalBody(){
  const body=document.getElementById("presetModalBody");
  if(presetView==="manage"){
    body.querySelectorAll(".tpl-card").forEach(card=>{
      const id=card.dataset.id;
      card.querySelector(".preset-edit").addEventListener("click",()=>startEditFocusPreset(id));
      card.querySelector(".preset-dup").addEventListener("click",()=>duplicateFocusPreset(id));
      card.querySelector(".preset-del").addEventListener("click",()=>deleteFocusPreset(id));
      const upBtn=card.querySelector(".preset-up"); if(!upBtn.disabled) upBtn.addEventListener("click",()=>moveFocusPreset(id,-1));
      const downBtn=card.querySelector(".preset-down"); if(!downBtn.disabled) downBtn.addEventListener("click",()=>moveFocusPreset(id,1));
    });
    const closeBtn=body.querySelector("#presetCloseBtn"); if(closeBtn) closeBtn.addEventListener("click",closePresetModal);
  } else if(presetView==="save"){
    const nameInp=body.querySelector("#presetSaveName");
    body.querySelector("#presetSaveCancel").addEventListener("click",closePresetModal);
    body.querySelector("#presetSaveConfirm").addEventListener("click",()=>confirmSaveFocusPreset(nameInp.value));
    nameInp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); confirmSaveFocusPreset(nameInp.value); } });
  } else if(presetView==="edit"){
    wirePresetEditView();
  }
}
function startEditFocusPreset(id){
  const p=focusPresets.find(x=>x.id===id); if(!p) return;
  presetEditId=id; presetDraft={ name:p.name, profileIds:[...p.profileIds] }; presetDraftDirty=false;
  presetView="edit"; renderPresetModal();
}
function wirePresetEditView(){
  const body=document.getElementById("presetModalBody");
  const nameInp=body.querySelector("#presetEditName");
  nameInp.addEventListener("input",()=>{ presetDraft.name=nameInp.value; presetDraftDirty=true; });
  body.querySelectorAll(".preset-check").forEach(cb=>{
    cb.addEventListener("change",()=>{
      const id=cb.dataset.id;
      if(cb.checked){ if(!presetDraft.profileIds.includes(id)) presetDraft.profileIds.push(id); }
      else{ presetDraft.profileIds=presetDraft.profileIds.filter(x=>x!==id); }
      presetDraftDirty=true;
    });
  });
  body.querySelector("#presetEditCancel").addEventListener("click",cancelEditFocusPreset);
  body.querySelector("#presetEditSave").addEventListener("click",saveEditFocusPreset);
}
function cancelEditFocusPreset(){
  if(presetDraftDirty && !confirm("Discard unsaved changes to this preset?")) return;
  presetEditId=null; presetDraft=null; presetDraftDirty=false;
  presetView="manage"; renderPresetModal();
}
function saveEditFocusPreset(){
  const name=(presetDraft.name||"").toString().trim();
  if(!name){ alert("Enter a preset name."); return; }
  const p=focusPresets.find(x=>x.id===presetEditId);
  if(p){ p.name=name; p.profileIds=orderedProfileIds(presetDraft.profileIds); p.updated=Date.now(); saveFocusPresets(); }
  presetEditId=null; presetDraft=null; presetDraftDirty=false;
  presetView="manage"; renderPresetModal();
  renderPresetBar();
}
function confirmSaveFocusPreset(nameRaw){
  const name=(nameRaw||"").toString().trim();
  if(!name){ alert("Enter a preset name."); return; }
  const profileIds=orderedProfileIds([...activeProfiles]);
  const existing=focusPresets.find(p=>p.name===name);
  if(existing){
    if(!confirm(`A preset named "${existing.name}" already exists. Replace its saved profile combination?`)) return;
    existing.profileIds=profileIds;
    existing.updated=Date.now();
  } else {
    focusPresets.push({ id:uid("fp"), name, profileIds, created:Date.now(), updated:Date.now() });
  }
  saveFocusPresets();
  closePresetModal();
  renderPresetBar();
}
function duplicateFocusPreset(id){
  const p=focusPresets.find(x=>x.id===id); if(!p) return;
  const now=Date.now();
  const idx=focusPresets.indexOf(p);
  focusPresets.splice(idx+1,0,{ id:uid("fp"), name:`${p.name} — Copy`, profileIds:[...p.profileIds], created:now, updated:now });
  saveFocusPresets();
  renderPresetModal();
  renderPresetBar();
}
function deleteFocusPreset(id){
  const p=focusPresets.find(x=>x.id===id); if(!p) return;
  if(!confirm(`Permanently delete the "${p.name}" focus preset?`)) return;
  focusPresets=focusPresets.filter(x=>x.id!==id);
  saveFocusPresets();
  renderPresetModal();
  renderPresetBar();
}
function moveFocusPreset(id, dir){
  const idx=focusPresets.findIndex(x=>x.id===id); if(idx<0) return;
  const newIdx=idx+dir; if(newIdx<0 || newIdx>=focusPresets.length) return;
  [focusPresets[idx],focusPresets[newIdx]]=[focusPresets[newIdx],focusPresets[idx]];
  saveFocusPresets();
  renderPresetModal();
  renderPresetBar();
}

    if(isEditingField("bill",billId,field)) return;
    const b=bills.find(x=>x.id===billId); if(!b) return;
    startInlineText({ type:"bill", id:billId, field, container:node, value:b[field], required:!!required, ariaLabel,
      getEntity:()=>bills.find(x=>x.id===billId), onCommit:(entity,v)=>{ entity[field]=v; saveBills(); }, onDone:renderBills });
  }
  node.addEventListener("click",open);
  node.addEventListener("keydown",e=>{ if(e.target!==node) return; if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
}
function openBillDuePopover(anchor, billId){
  const b0=bills.find(x=>x.id===billId); if(!b0) return;
  openPopover({ type:"bill", id:billId, field:"due", anchor,
    build(pop,close){
      pop.innerHTML=`<div class="pop-title">Due date</div><input type="date" id="pop-date" value="${b0.due||""}" aria-label="Bill due date"><div class="pop-actions"><button class="pop-clear" id="pop-clear">Clear</button><button class="btn sm" id="pop-done">Done</button></div>`;
      function commit(){ const b=bills.find(x=>x.id===billId); if(!b) return; const v=pop.querySelector("#pop-date").value; if(v!==b.due){ b.due=v; saveBills(); renderBills(); } }
      pop.querySelector("#pop-date").addEventListener("change",commit);
      pop.querySelector("#pop-clear").addEventListener("click",()=>{ const b=bills.find(x=>x.id===billId); if(!b) return; b.due=""; saveBills(); renderBills(); close(true); });
      pop.querySelector("#pop-done").addEventListener("click",()=>{ commit(); close(true); });

  });
}

  if(b.amount!==""&&b.amount!=null) bits.push(`<span class="ptxt bill-amt" id="br-amt">${esc(fmtMoney(b.amount)||b.amount)}</span>`);
  if(b.note) bits.push(`<span class="ptxt" id="br-note">${esc(b.note)}</span>`);
  const dots=placePeopleDots(b.people); if(dots) bits.push(`<span id="br-people">${dots}</span>`);

    <input type="checkbox" class="cbx" ${b.paid?"checked":""} aria-label="Paid">

        makeWhoPicker(pop.querySelector("#pop-who"), b.people, ids=>{ const cur=bills.find(x=>x.id===b.id); if(!cur) return; cur.people=ids; saveBills(); renderBills(); });
        pop.querySelector("#pop-done").addEventListener("click",()=>close(true));

  row.querySelector(".bill-edit").addEventListener("click",()=>{ closeActiveEdit(true); billEditingId=b.id; renderBills(); });
  row.querySelector(".bill-del").addEventListener("click",()=>{ if(confirm(`Remove "${b.name||"this bill"}"?`)){ bills=bills.filter(x=>x.id!==b.id); saveBills(); renderBills(); } });

/* ---------------- quick notes ---------------- */
/* Pinned first; within each group, most-recently-updated first. */
function sortedNotes(){
  return [...notes].sort((a,b)=> ((b.pinned?1:0)-(a.pinned?1:0)) || ((b.updated||0)-(a.updated||0)));
}
function renderNotes(){
  const el=document.getElementById("noteList");
  el.innerHTML = notes.length ? "" : `<div class="empty-state" style="padding:24px 12px"><div class="big">No notes yet.</div>Jot something down above.</div>`;
  sortedNotes().forEach(n=>{ el.appendChild(renderNoteRow(n)); });
  document.getElementById("noteCount").textContent = notes.length ? String(notes.length) : "";
}
function wireInlineNoteText(node, noteId){
  node.classList.add("editable"); node.tabIndex=0; node.setAttribute("role","button"); node.setAttribute("aria-label","Edit note");
  function open(){
    if(isEditingField("note",noteId,"text")) return;
    const n=notes.find(x=>x.id===noteId); if(!n) return;
    startInlineText({ type:"note", id:noteId, field:"text", container:node, value:n.text, required:true, multiline:true, ariaLabel:"Note text",
      getEntity:()=>notes.find(x=>x.id===noteId), onCommit:(entity,v)=>{ entity.text=v; entity.updated=Date.now(); saveNotes(); }, onDone:renderNotes });
  }
  node.addEventListener("click",open);
  node.addEventListener("keydown",e=>{ if(e.target!==node) return; if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
}
function renderNoteRow(n){
  const row=document.createElement("div"); row.className="note-row"+(n.pinned?" pinned":""); row.dataset.id=n.id;
  row.innerHTML=`
    <div class="note-body"><div class="note-text" id="nr-text">${esc(n.text)}</div></div>
    <div class="note-actions">
      <button class="note-pin${n.pinned?" on":""}" title="${n.pinned?"Unpin":"Pin"}">📌</button>
      <button class="note-del" title="Delete">✕</button>
    </div>`;
  wireInlineNoteText(row.querySelector("#nr-text"), n.id);
  row.querySelector(".note-pin").addEventListener("click",()=>{ const cur=notes.find(x=>x.id===n.id); if(!cur) return; cur.pinned=!cur.pinned; cur.updated=Date.now(); saveNotes(); renderNotes(); });
  row.querySelector(".note-del").addEventListener("click",()=>{ if(confirm("Delete this note?")){ notes=notes.filter(x=>x.id!==n.id); saveNotes(); renderNotes(); } });
  return row;
}

/* ---------------- important dates: rendering ---------------- */
function renderDatesSection(){
  renderDatesQuick();
  const allBox=document.getElementById("datesAll");
  const btn=document.getElementById("viewAllDatesBtn");
  if(datesAllOpen){ allBox.classList.remove("hidden"); btn.textContent="Hide all"; btn.setAttribute("aria-expanded","true"); renderDatesAllPanel(); }
  else { allBox.classList.add("hidden"); btn.textContent="View all"; btn.setAttribute("aria-expanded","false"); }
}
function renderDatesQuick(){
  const wrap=document.getElementById("datesQuick");
  const list=activeDatesSorted();
  let show=list.slice(0,5);
  /* While the View All panel is open, IT is the exclusive host for the full editor — never duplicate
     it here too. Only pull the in-progress edit into the quick view when View All is closed. */
  if(!datesAllOpen && dateEditingId && !show.some(d=>d.id===dateEditingId)){
    const ed=importantDates.find(d=>d.id===dateEditingId);
    if(ed) show=[ed, ...show.filter(d=>d.id!==dateEditingId).slice(0,4)];
  }
  wrap.innerHTML="";
  if(!show.length){
    const empty=document.createElement("div"); empty.className="dates-empty";
    empty.innerHTML=`No upcoming dates yet. <button class="btn sm" id="addDateBtnEmpty">+ Add date</button>`;
    wrap.appendChild(empty);
    empty.querySelector("#addDateBtnEmpty").addEventListener("click",addImportantDate);
    return;
  }
  show.forEach(d=>{ const useEditor=!datesAllOpen && dateEditingId===d.id; wrap.appendChild(useEditor ? renderDateEditorCard(d) : renderDateCard(d)); });
  if(list.length>show.length){
    const more=document.createElement("div"); more.className="dates-more"; more.tabIndex=0; more.setAttribute("role","button");
    more.setAttribute("aria-label", `${list.length-show.length} more upcoming dates — view all`);
    more.textContent=`+ ${list.length-show.length} more`;
    const openAll=()=>{ datesAllOpen=true; renderDatesSection(); };
    more.addEventListener("click",openAll);
    more.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openAll(); } });
    wrap.appendChild(more);
  }
}
function renderDatesAllPanel(){
  const listEl2=document.getElementById("datesAllList");
  const list=activeDatesSorted();
  listEl2.innerHTML = list.length ? "" : `<div class="empty-state" style="padding:20px 12px"><div class="big">No upcoming dates.</div></div>`;
  list.forEach(d=>{ listEl2.appendChild(dateEditingId===d.id ? renderDateEditorCard(d) : renderDateCard(d)); });
  const toggle=document.getElementById("pastDatesToggle");
  toggle.textContent = pastDatesOpen ? "Hide past dates" : "Show past dates";
  toggle.setAttribute("aria-expanded", pastDatesOpen?"true":"false");
  const pastBox=document.getElementById("pastDatesList");
  if(pastDatesOpen){
    pastBox.classList.remove("hidden"); pastBox.classList.add("expanded");
    const past=pastDatesSorted();
    pastBox.innerHTML = past.length ? "" : `<div class="empty-state" style="padding:16px 12px"><div class="big">No past dates.</div></div>`;
    past.forEach(d=>{ pastBox.appendChild(dateEditingId===d.id ? renderDateEditorCard(d) : renderDateCard(d)); });
  } else { pastBox.classList.add("hidden"); pastBox.classList.remove("expanded"); pastBox.innerHTML=""; }
}
function dateCardMetaHtml(d){
  const bits=[];
  if(d.location) bits.push(`<span class="ptxt" id="dc-loc">📍 ${esc(d.location)}</span>`);
  if(d.note) bits.push(`<span class="ptxt">${esc(d.note)}</span>`);
  return bits.length ? `<div class="dc-sub">${bits.join('<span style="opacity:.4">·</span>')}</div>` : "";
}

  const d0=importantDates.find(x=>x.id===dateId); if(!d0) return;
  openPopover({ type:"date", id:dateId, field:"daterange", anchor,
    build(pop,close){
      pop.innerHTML=`<div class="pop-title">Date</div>
        <div class="pop-row"><div style="flex:1"><label>Start date</label><input type="date" id="pop-start" aria-label="Start date"></div></div>
        <div class="pop-row"><div style="flex:1"><label>End date (optional)</label><input type="date" id="pop-end" aria-label="End date"></div></div>

function renderDateCard(d){
  const el=document.createElement("div"); el.className="date-card"; el.dataset.id=d.id;
  const cat=DATE_CATEGORIES[d.category]||DATE_CATEGORIES.other;
  el.style.setProperty("--cat", cat.color);
  const countdown=dateCountdown(d);
  if(isOngoingLabel(countdown)) el.classList.add("ongoing");
  const countClass = countdown==="Today" ? "today" : (isOngoingLabel(countdown) ? "ongoing" : "");
  const hasTime = !!(d.startTime || d.endTime);
  const hasPeople = d.people && d.people.length;
  el.innerHTML=`
    <div class="dc-top"><span class="dc-count ${countClass}">${esc(countdown)}</span><span class="dc-cat" id="dc-cat">${esc(cat.label)}</span></div>
    <div class="dc-title" id="dc-title">${esc(d.title)||"(untitled)"}</div>
    <div class="dc-when"><span id="dc-date">${esc(dateDatePartText(d))}</span>${hasTime?` · <span id="dc-time">${esc(dateTimePartText(d))}</span>`:""}</div>
    ${hasPeople?`<div class="dc-people" id="dc-people">${peopleChipsHtml(d.people)}</div>`:""}

       from any prior version — old single-person tasks, no Places, no Important Dates — load fine;

    if(Array.isArray(d)){ tasks=d.map(migrateTask); }

      if(Array.isArray(d.notes)) notes=d.notes.map(migrateNote).filter(n=>n.text!=="");

/* =====================================================================
   PRINT CENTER
   Builds a completely separate print-only document from current in-memory
   data and hands it to window.print() — the live dashboard DOM is never
   touched, and nothing here ever calls a save*() function or Firebase.
   Choices reset each time the modal opens (deliberately not persisted).
   ===================================================================== */
let printPrevFocus=null;
function openPrintCenter(){
  closeActiveEdit(false); // opening Print Center must never commit/save whatever was being edited
  const sel=document.getElementById("pmProfile");
  sel.innerHTML = `<option value="all">All profiles</option>` + people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  sel.value="all";
  printPrevFocus=document.activeElement;
  document.getElementById("printModalBackdrop").classList.remove("hidden");
  document.addEventListener("keydown", printModalKeyHandler, true);
  document.getElementById("printModal").focus();
}
function closePrintCenter(){
  document.getElementById("printModalBackdrop").classList.add("hidden");
  document.removeEventListener("keydown", printModalKeyHandler, true);
  if(printPrevFocus && typeof printPrevFocus.focus==="function") printPrevFocus.focus();
  printPrevFocus=null;
}
function printModalKeyHandler(e){
  if(e.key==="Escape"){ e.preventDefault(); closePrintCenter(); return; }
  if(e.key!=="Tab") return;
  const modal=document.getElementById("printModal");
  const focusables=[...modal.querySelectorAll('button,input,select,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled && el.offsetParent!==null);
  if(!focusables.length) return;
  const first=focusables[0], last=focusables[focusables.length-1];
  if(document.activeElement===modal || !modal.contains(document.activeElement)){ e.preventDefault(); (e.shiftKey?last:first).focus(); }
  else if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

/* Shared profile rule for tasks/dates/places/bills: "all profiles", the selected profile, or
   anything assigned to the family-wide pseudo-id. Shopping and Quick Notes skip this entirely —
   they're not profile-specific. */
function printProfileMatch(itemPeople, profileFilter){
  if(profileFilter==="all") return true;
  const ids=normPeople(itemPeople);
  if(ids.includes("family")) return true;
  return ids.includes(profileFilter);
}
function printProfileNames(itemPeople){
  const ids=normPeople(itemPeople);
  if(!ids.length) return "";
  if(ids.includes("family")) return "All";

}
function addDaysStr(ymd, n){ const d=localMoment(ymd,"00:00"); if(!d) return ymd; d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function printFilterTasks(opts){
  const list=tasks.filter(t=>{
    if(!printProfileMatch(t.people, opts.profile)) return false;
    if(isLater(t)) return opts.includeLater;
    if(opts.hideCompleted && isDone(t)) return false;
    return true;
  });
  const tier=t=>isSomeday(t)?3:isScheduledLater(t)?2:isDone(t)?1:0;
  list.sort((a,b)=>(tier(a)-tier(b)) || ((timeToMin(a.time)??1e9)-(timeToMin(b.time)??1e9)) || ((b.priority||0)-(a.priority||0)));
  return list;
}
/* Date-range filtering is deliberately calendar-day based (plain "YYYY-MM-DD" string compares),
   matching how Today/Next 7/All upcoming read to a person looking at a fridge sheet — not the
   time-of-day-aware isPastDate() the live dashboard uses for its own "ended" badge. */
function printFilterDates(opts){
  const ts=todayStr();
  const windowEnd=addDaysStr(ts,6); // "next 7 days" = today..today+6 inclusive
  const list=importantDates.filter(d=>{
    if(!d.startDate) return false;
    if(!printProfileMatch(d.people, opts.profile)) return false;
    const start=d.startDate, end=d.endDate||d.startDate;
    if(opts.dateRange==="today") return start<=ts && ts<=end;
    if(opts.dateRange==="next7") return start<=windowEnd && end>=ts;
    return end>=ts; // all upcoming
  });
  list.sort((a,b)=>(a.startDate||"").localeCompare(b.startDate||"") || (a.startTime||"").localeCompare(b.startTime||""));
  return list;
}
function printFilterNotes(opts){ return sortedNotes(); } // profile-independent by design
function printFilterPlaces(opts){
  return sortedPlaces().filter(p=>printProfileMatch(p.people, opts.profile) && !(opts.hideCompleted && p.visited));
}
function printFilterBills(opts){
  return sortedBills().filter(b=>printProfileMatch(b.people, opts.profile) && !(opts.hideCompleted && b.paid));
}
function printFilterShop(opts){
  return [...shop].sort((a,b)=>(a.got?1:0)-(b.got?1:0)).filter(s=>!(opts.hideCompleted && s.got));
}
function printFilterBYL(opts){ return sortedBYL().filter(b=>!(opts.hideCompleted && b.done)); } // profile-independent by design

function buildPrintBody(data, opts){

/* Pure read-only build: reads current in-memory arrays and the passed-in options, mutates
   nothing, saves nothing, never touches Firebase. */
function buildPrintSheet(opts){
  const sheet=document.createElement("div");
  sheet.className="print-sheet format-"+(opts.format==="fridge"?"fridge":"full");

  const data={
    tasks: opts.sections.tasks ? printFilterTasks(opts) : [],
    dates: opts.sections.dates ? printFilterDates(opts) : [],
    notes: opts.sections.notes ? printFilterNotes(opts) : [],
    places: opts.sections.places ? printFilterPlaces(opts) : [],
    bills: opts.sections.bills ? printFilterBills(opts) : [],
    byl: opts.sections.byl ? printFilterBYL(opts) : [],
    shop: opts.sections.shop ? printFilterShop(opts) : [],
  };
  const hasAny = Object.keys(data).some(k=>opts.sections[k] && data[k].length);

  const now=new Date();
  const formatName = opts.format==="fridge" ? "Fridge Sheet" : "Full Planner";
  const profileName = opts.profile==="all" ? "All Profiles" : esc(getPerson(opts.profile).name);
  let html=`<div class="print-sheet-header">
    <div class="ps-brand">THE GRIND</div>
    <div class="ps-meta">${esc(formatName)} · ${profileName}</div>
    <div class="ps-meta ps-printed">Printed ${esc(now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"}))} at ${esc(now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))}</div>
  </div>`;

  if(!hasAny){
    html+=`<div class="print-empty">Nothing matching these print options.</div>`;
  } else {
    if(opts.format==="fridge"){
      /* Always the selected profile's (or family-wide) Today tasks, regardless of Hide completed —
         that option hides completed rows from the list below, it must not change this count. */
      const todays=tasks.filter(t=>isToday(t) && printProfileMatch(t.people, opts.profile));
      const doneToday=todays.filter(isDone).length;
      html+=`<div class="print-summary">${doneToday} of ${todays.length} done today</div>`;
    }
    html+=buildPrintBody(data, opts);
  }
  sheet.innerHTML=html;
  return sheet;
}
function generateAndPrint(opts){
  const sheet=buildPrintSheet(opts);
  document.body.appendChild(sheet);

  /* All cleanup listeners are registered BEFORE window.print() is called, and cleanup itself is
     idempotent (guarded by `done`) since afterprint, the print-media-query change, and the
     fallback timer can all fire — we only want the first one to actually do anything. The
     fallback is a generous 5 minutes so a print-preview left open doesn't lose its sheet mid-review;
     it exists purely in case neither event fires in some browser. */
  let done=false, mql=null, fallbackTimer=null;
  function onMqlChange(e){ if(!e.matches) cleanup(); } // fires when leaving print mode
  function cleanup(){
    if(done) return; done=true;
    window.removeEventListener("afterprint", cleanup);
    if(mql){ if(mql.removeEventListener) mql.removeEventListener("change", onMqlChange); else if(mql.removeListener) mql.removeListener(onMqlChange); }
    if(fallbackTimer) clearTimeout(fallbackTimer);
    if(sheet.isConnected) sheet.remove();
  }
  window.addEventListener("afterprint", cleanup);
  if(window.matchMedia){
    mql=window.matchMedia("print");
    if(mql.addEventListener) mql.addEventListener("change", onMqlChange);
    else if(mql.addListener) mql.addListener(onMqlChange); // older Safari
  }
  fallbackTimer=setTimeout(cleanup, 300000); // 5 minutes

  window.print();
}

/* A bare Ctrl+P (or the browser's own print menu item) skips the Print Center entirely, so
   @media print's "hide everything but .print-sheet" rule would otherwise print a blank page —
   this builds a default Fridge Sheet at the last possible moment, only when nothing was already
   built by generateAndPrint(). Marked with a dedicated class so its own cleanup only ever touches
   a sheet IT created, never interfering with generateAndPrint()'s own sheet/cleanup. Read-only,
   like every other print-sheet build: no save call, no localStorage/Firebase write, no sound. */
window.addEventListener("beforeprint", ()=>{
  if(document.querySelector(".print-sheet")) return; // Print Center already built one for this print
  const sheet=buildPrintSheet({ format:"fridge", profile:"all",
    sections:{tasks:true,dates:true,notes:true,places:true,bills:true,shop:true},
    hideCompleted:true, includeLater:false, dateRange:"next7" });
  sheet.classList.add("print-sheet-fallback");
  document.body.appendChild(sheet);
});
window.addEventListener("afterprint", ()=>{
  const fallbackSheet=document.querySelector(".print-sheet-fallback");
  if(fallbackSheet) fallbackSheet.remove();
});

/* ---------------- tick ---------------- */
function tick(){ const d=new Date(); document.getElementById("clock").innerHTML=`${pad2(d.getHours())}:${pad2(d.getMinutes())}<span class="sec">:${pad2(d.getSeconds())}</span>`;
  /* editingActive() covers the full task editor, place editor, date editor, AND any inline text/popover —
     nothing the 1s tick does may ever rebuild DOM out from under an open editor. */
  if(!editingActive()){
    if(pendingRemoteRender){ pendingRemoteRender=false; render(); return; }
    if(normalizeLater()){ render(); return; }
    const no=new Set(tasks.filter(isOverdue).map(t=>t.id)); let ch=no.size!==overdueSet.size; if(!ch) for(const i of no) if(!overdueSet.has(i)){ ch=true; break; }
    if(ch){ render(); return; }
    renderNextUp(computeNextUp());
    document.querySelectorAll(".row").forEach(row=>{ const t=tasks.find(x=>x.id===row.dataset.id); const c=row.querySelector(".cell-time"); if(!t||!c) return; const s=timeToMin(t.time); let cd=""; if(s!=null&&isActive(t)){ const dd=s-nowMin(); if(dd>0&&dd<=60)cd=`<span class="cd">in ${fmtDelta(dd)}</span>`; else if(dd===0)cd=`<span class="cd">now</span>`; else if(dd<0)cd=`<span class="cd late">▲ ${fmtDelta(dd)} late</span>`; } c.innerHTML=`<span class="t ${t.time?'':'none'}">${t.time?fmt12(t.time):"—"}</span>${cd}`; });
  }
}

/* ---------------- init ---------------- */
document.getElementById("datestr").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
{ const vp=loadJSON(K_PREFS); if(vp){ document.getElementById("showDone").checked=typeof vp.showDone==="boolean"?vp.showDone:(typeof vp.hideDone==="boolean"?!vp.hideDone:false); document.getElementById("showLater").checked=!!vp.showLater; document.getElementById("showSomeday").checked=!!vp.showSomeday; } }
updateSoundToggleLabel();
render(); initSync(); tick(); setInterval(tick,1000);
