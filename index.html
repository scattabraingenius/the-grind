function renderDateCard(d){
  const el=document.createElement("div"); el.className="date-card"; el.dataset.id=d.id;
  const cat=DATE_CATEGORIES[d.category]||DATE_CATEGORIES.other;
  el.style.setProperty("--cat", cat.color);
  const countdown=dateCountdown(d);
  if(isOngoingLabel(countdown)) el.classList.add("ongoing");
  const countClass = countdown==="Today" ? "today" : (isOngoingLabel(countdown) ? "ongoing" : "");
  const hasTime = !!(d.startTime || d.endTime);
  const hasPeople = d.people && d.people.length;
  el.innerHTML=`
    <div class="dc-top"><span class="dc-count ${countClass}">${esc(countdown)}</span><span class="dc-cat" id="dc-cat">${esc(cat.label)}</span></div>
    <div class="dc-title" id="dc-title">${esc(d.title)||"(untitled)"}</div>
    <div class="dc-when"><span id="dc-date">${esc(dateDatePartText(d))}</span>${hasTime?` · <span id="dc-time">${esc(dateTimePartText(d))}</span>`:""}</div>
    ${hasPeople?`<div class="dc-people" id="dc-people">${peopleChipsHtml(d.people)}</div>`:""}
    ${dateCardMetaHtml(d)}
    <div class="dc-actions"><button class="iconbtn edit" title="Edit" aria-label="Edit ${esc(d.title)||'date'}">✎</button><button class="iconbtn del" title="Delete" aria-label="Delete ${esc(d.title)||'date'}">✕</button></div>`;
  wireDateText(el.querySelector("#dc-title"), d.id, "title", "Edit title", true);
  const dateEl=el.querySelector("#dc-date"); dateEl.classList.add("editable"); dateEl.tabIndex=0; dateEl.setAttribute("role","button"); dateEl.setAttribute("aria-label","Edit date");
  const openDate=()=>openDateRangePopover(dateEl,d.id);
  dateEl.addEventListener("click",openDate); dateEl.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDate(); } });
  const timeEl=el.querySelector("#dc-time");
  if(timeEl){ timeEl.classList.add("editable"); timeEl.tabIndex=0; timeEl.setAttribute("role","button"); timeEl.setAttribute("aria-label","Edit time");
    const openTime=()=>openDateTimePopover(timeEl,d.id);
    timeEl.addEventListener("click",openTime); timeEl.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openTime(); } }); }
  const peopleEl=el.querySelector("#dc-people");
  if(peopleEl){ peopleEl.classList.add("editable"); peopleEl.tabIndex=0; peopleEl.setAttribute("role","button"); peopleEl.setAttribute("aria-label","Edit who's involved");
    const openPpl=()=>openDatePeoplePopover(peopleEl,d.id);
    peopleEl.addEventListener("click",openPpl); peopleEl.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openPpl(); } }); }
  const catEl=el.querySelector("#dc-cat"); catEl.classList.add("editable"); catEl.tabIndex=0; catEl.setAttribute("role","button"); catEl.setAttribute("aria-label","Edit category");
  const openCat=()=>openDateCategoryPopover(catEl,d.id);
  catEl.addEventListener("click",openCat); catEl.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openCat(); } });
  const locEl=el.querySelector("#dc-loc"); if(locEl) wireDateText(locEl, d.id, "location", "Edit location", false);
  el.querySelector(".edit").addEventListener("click",()=>{ closeActiveEdit(true); dateEditingId=d.id; renderDatesSection(); });
  el.querySelector(".del").addEventListener("click",()=>{ if(confirm(`Delete "${d.title||"this date"}"?`)){ importantDates=importantDates.filter(x=>x.id!==d.id); saveDates(); renderDatesSection(); } });
  return el;
}
function renderDateEditorCard(d){
  const box=document.createElement("div"); box.className="date-editor"; box.dataset.id=d.id;
  const id=d.id;
  box.innerHTML=`
    <div class="grid">
      <div class="field full"><label>Title</label><input type="text" id="de-title" value="${esc(d.title)}" placeholder="e.g. Flight to Chicago"></div>
      <div class="field"><label>Category</label><select id="de-cat">${Object.entries(DATE_CATEGORIES).map(([k,c])=>`<option value="${k}" ${k===d.category?"selected":""}>${esc(c.label)}</option>`).join("")}</select></div>
      <div class="field"><label>Location (optional)</label><input type="text" id="de-loc" value="${esc(d.location)}" placeholder="where"></div>
      <div class="field"><label>Start date</label><input type="date" id="de-start" value="${d.startDate||""}"></div>
      <div class="field"><label>Start time (optional)</label><input type="time" id="de-stime" value="${d.startTime||""}"></div>
      <div class="field"><label>End date (optional)</label><input type="date" id="de-end" value="${d.endDate||""}"></div>
      <div class="field"><label>End time (optional)</label><input type="time" id="de-etime" value="${d.endTime||""}"></div>
      <div class="field full"><label>Who's involved (optional)</label><div class="who-picker" id="de-who"></div></div>
      <div class="field full"><label>Note (optional)</label><textarea id="de-note" placeholder="anything to remember">${esc(d.note)}</textarea></div>
    </div>
    <div class="field full" id="de-error" style="color:var(--alarm);font-size:12px;display:none;"></div>
    <div class="actions"><button class="btn del-de">Delete</button><button class="btn cancel-de">Cancel</button><button class="btn add save-de">Save</button></div>`;
  const who=makeWhoPicker(box.querySelector("#de-who"), d.people);
  const errEl=box.querySelector("#de-error");
  box.querySelector(".save-de").addEventListener("click",()=>{
    const rec=importantDates.find(x=>x.id===id); if(!rec) return;
    const title=box.querySelector("#de-title").value.trim();
    const startDate=box.querySelector("#de-start").value;
    const endDate=box.querySelector("#de-end").value;
    const startTime=box.querySelector("#de-stime").value;
    const endTime=box.querySelector("#de-etime").value;
    errEl.style.display="none";
    if(!title){ errEl.textContent="Title is required."; errEl.style.display="block"; return; }
    const rangeMsg=validateImportantDate(startDate,endDate,startTime,endTime);
    if(rangeMsg){ errEl.textContent=rangeMsg; errEl.style.display="block"; return; }
    rec.title=title; rec.category=box.querySelector("#de-cat").value; rec.location=box.querySelector("#de-loc").value.trim();
    rec.startDate=startDate; rec.endDate=endDate; rec.startTime=startTime; rec.endTime=endTime;
    rec.people=who.get(); rec.note=box.querySelector("#de-note").value.trim(); rec.updated=Date.now();
    dateEditingId=null; saveDates(); renderDatesSection();
  });
  box.querySelector(".cancel-de").addEventListener("click",()=>{
    const rec=importantDates.find(x=>x.id===id);
    if(rec && !rec.title && !rec.startDate && !rec.location && !rec.note && !rec.people.length) importantDates=importantDates.filter(x=>x.id!==id);
    dateEditingId=null; renderDatesSection();
  });
  box.querySelector(".del-de").addEventListener("click",()=>{ if(confirm("Delete this date?")){ importantDates=importantDates.filter(x=>x.id!==id); dateEditingId=null; saveDates(); renderDatesSection(); } });
  setTimeout(()=>box.querySelector("#de-title").focus(),0);
  return box;
}
function addImportantDate(){ closeActiveEdit(true); const d=blankImportantDate(); importantDates.unshift(d); dateEditingId=d.id; renderDatesSection(); }
document.getElementById("addDateBtn").addEventListener("click",addImportantDate);
document.getElementById("viewAllDatesBtn").addEventListener("click",()=>{ datesAllOpen=!datesAllOpen; renderDatesSection(); });
document.getElementById("closeAllDatesBtn").addEventListener("click",()=>{ datesAllOpen=false; renderDatesSection(); });
document.getElementById("pastDatesToggle").addEventListener("click",()=>{ pastDatesOpen=!pastDatesOpen; renderDatesAllPanel(); });

/* ---------------- quick add / add ---------------- */
document.getElementById("quickInput").addEventListener("keydown",e=>{ if(e.key!=="Enter") return; const v=e.target.value.trim(); if(!v) return; const t=blankTask(v); if(activePerson!=="all") t.people=[activePerson]; tasks.unshift(t); e.target.value=""; saveTasks(); render(); });
document.getElementById("addBtn").addEventListener("click",()=>{
  closeActiveEdit(true);
  const quickInput=document.getElementById("quickInput");
  const t=blankTask(quickInput.value.trim());
  if(activePerson!=="all") t.people=[activePerson];
  tasks.unshift(t);
  quickInput.value="";
  editingId=t.id; render();
});

/* ---------------- toolbar ---------------- */
["searchInput","sortBy","hideDone","showLater"].forEach(id=>document.getElementById(id).addEventListener("input",render));
["hideDone","showLater"].forEach(id=>document.getElementById(id).addEventListener("input",saveViewPrefs));
document.getElementById("deleteCompletedBtn").addEventListener("click",()=>{
  const n=tasks.filter(isDone).length;
  if(!n) return;
  if(!confirm(`Permanently delete all ${n} completed tasks across all profiles?`)) return;
  tasks=tasks.filter(t=>!isDone(t));
  saveTasks();
  render();
});
function updateSoundToggleLabel(){ const btn=document.getElementById("soundToggle"); if(btn) btn.textContent = settings.soundEnabled ? "Sound: On" : "Sound: Off"; }
document.getElementById("soundToggle").addEventListener("click",()=>{ settings.soundEnabled=!settings.soundEnabled; saveSettings(); updateSoundToggleLabel(); });
document.getElementById("printBtn").addEventListener("click",()=>window.print());
document.getElementById("exportBtn").addEventListener("click",()=>{
  const bundle={version:VERSION,people,tasks,shop,places,importantDates,bills,notes};
  const blob=new Blob([JSON.stringify(bundle,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`the-grind-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!confirm("Import this file? It replaces or updates your current Grind data.")) return;
    closeActiveEdit(false);
    /* Every collection is imported independently and only overwritten when present, so backups
       from any prior version — old single-person tasks, no Places, no Important Dates — load fine;
       whatever the file doesn't include is simply left as-is rather than wiped. */
    if(Array.isArray(d)){ tasks=d.map(migrateTask); }
    else {
      if(Array.isArray(d.people)) people=d.people;
      if(Array.isArray(d.tasks)) tasks=d.tasks.map(migrateTask);
      if(Array.isArray(d.shop)) shop=d.shop.map(s=>Object.assign(blankShop(),s));
      if(Array.isArray(d.places)) places=d.places.map(migratePlace);
      if(Array.isArray(d.importantDates)) importantDates=d.importantDates.map(migrateImportantDate);
      if(Array.isArray(d.bills)) bills=d.bills.map(migrateBill);
      /* notes: migrate (backfills ids/timestamps, coerces text/pinned) then drop anything that's
         still blank after coercion — a malformed entry never crashes the app, it's just discarded.
         Settings are deliberately never touched here — sound stays this device's own preference. */
      if(Array.isArray(d.notes)) notes=d.notes.map(migrateNote).filter(n=>n.text!=="");
    }
    editingId=null; placeEditingId=null; dateEditingId=null; billEditingId=null; savePeople(); saveTasks(); saveShop(); savePlaces(); saveDates(); saveBills(); saveNotes(); render();
  }catch(err){ alert("Couldn't read that file — expected a The Grind export (.json)."); } };
  r.readAsText(f); e.target.value="";
});

/* ---------------- tick ---------------- */
function tick(){ const d=new Date(); document.getElementById("clock").innerHTML=`${pad2(d.getHours())}:${pad2(d.getMinutes())}<span class="sec">:${pad2(d.getSeconds())}</span>`;
  /* editingActive() covers the full task editor, place editor, date editor, AND any inline text/popover —
     nothing the 1s tick does may ever rebuild DOM out from under an open editor. */
  if(!editingActive()){
    if(pendingRemoteRender){ pendingRemoteRender=false; render(); return; }
    if(normalizeLater()){ render(); return; }
    const no=new Set(tasks.filter(isOverdue).map(t=>t.id)); let ch=no.size!==overdueSet.size; if(!ch) for(const i of no) if(!overdueSet.has(i)){ ch=true; break; }
    if(ch){ render(); return; }
    renderNextUp(computeNextUp());
    document.querySelectorAll(".row").forEach(row=>{ const t=tasks.find(x=>x.id===row.dataset.id); const c=row.querySelector(".cell-time"); if(!t||!c) return; const s=timeToMin(t.time); let cd=""; if(s!=null&&isActive(t)){ const dd=s-nowMin(); if(dd>0&&dd<=60)cd=`<span class="cd">in ${fmtDelta(dd)}</span>`; else if(dd===0)cd=`<span class="cd">now</span>`; else if(dd<0)cd=`<span class="cd late">▲ ${fmtDelta(dd)} late</span>`; } c.innerHTML=`<span class="t ${t.time?'':'none'}">${t.time?fmt12(t.time):"—"}</span>${cd}`; });
  }
}

document.getElementById("datestr").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
{ const vp=loadJSON(K_PREFS); if(vp){ document.getElementById("hideDone").checked=!!vp.hideDone; document.getElementById("showLater").checked=!!vp.showLater; } }
updateSoundToggleLabel();
render(); initSync(); tick(); setInterval(tick,1000);
